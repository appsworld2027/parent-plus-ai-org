name: AI PM interview and decision brief

on:
  workflow_dispatch:
    inputs:
      idea_id:
        description: 'Existing IDEA-ID from founder intake'
        required: true
        type: string
      discovery_answers:
        description: 'Optional JSON answers from founder interview'
        required: false
        type: string

permissions:
  contents: write

jobs:
  discovery:
    name: AI CPTO decision brief
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Generate decision brief
        env:
          DISCOVERY_ANSWERS: ${{ inputs.discovery_answers }}
        run: node scripts/create-decision-brief.mjs "${{ inputs.idea_id }}"
      - name: Publish founder summary
        run: |
          echo '## AI PM decision brief created' >> "$GITHUB_STEP_SUMMARY"
          cat evidence/decision-briefs/${{ inputs.idea_id }}.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit decision brief
        run: |
          git config user.name 'appsworld-ai-org'
          git config user.email 'ai-org@appsworld.local'
          git add evidence/decision-briefs orchestration/task-events.jsonl
          git commit -m "product: create AI PM decision brief for ${{ inputs.idea_id }}"
          git push
