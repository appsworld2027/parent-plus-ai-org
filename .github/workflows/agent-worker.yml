# Reusable agent worker. The router assigns a role and the canonical free-only execution path.
# The workflow owns issue-stage transitions; agents provide implementation and evidence.
name: Agent worker

on:
  workflow_call:
    inputs:
      number:
        description: Issue or PR number
        required: true
        type: string
      handbook_ref:
        description: Branch/tag of the AI Org handbook to use
        required: false
        type: string
        default: main
      dispatch_workflow:
        description: Caller workflow file to re-dispatch when the stage label changes
        required: false
        type: string
        default: ai-agents.yml
      tool_mode:
        description: standard or readonly; readonly is restricted to read and one issue comment
        required: false
        type: string
        default: standard
      stage_override:
        description: Restricted synthetic-stage override for read-only AI Org smoke tests only
        required: false
        type: string
        default: ""
      qualification_fixture:
        description: Versioned read-only AI Org synthetic qualification fixture
        required: false
        type: string
        default: ""
      feature_slug:
        description: Optional stable feature slug; blank during initial discovery
        required: false
        type: string
        default: ""
    secrets:
      GROQ_API_KEY:
        required: false
      NVIDIA_NIM_API_KEY:
        required: false
      AI_ORG_HANDBOOK_SSH_KEY:
        required: false

jobs:
  agent:
    if: >-
      vars.UNATTENDED_AGENTS == 'on' &&
      (github.repository == 'appsworld2027/parent-plus-ai-org' || github.event.repository.private == true)
    runs-on: ubuntu-latest
    timeout-minutes: 95
    concurrency:
      group: ai-agent-${{ github.repository }}-${{ inputs.number }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      NUMBER: ${{ inputs.number }}
      TOOL_MODE: ${{ inputs.tool_mode }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect AI Org handbook visibility
        id: handbook_visibility
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o "$RUNNER_TEMP/ai-org-repo.json" -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/appsworld2027/parent-plus-ai-org)
          if [ "$status" = "200" ]; then
            private=$(jq -er '.private | tostring' "$RUNNER_TEMP/ai-org-repo.json")
          elif [ "$status" = "404" ]; then
            # A caller token cannot see a private repository. Treat it as private and require the read-only key.
            private=true
          else
            echo "::error::Could not verify AI Org handbook visibility (HTTP $status); refusing an unknown checkout mode."
            exit 1
          fi
          case "$private" in true|false) ;; *) echo "::error::Invalid repository visibility response"; exit 1;; esac
          echo "private=$private" >> "$GITHUB_OUTPUT"

      - name: Check private handbook access
        if: steps.handbook_visibility.outputs.private == 'true' && github.repository != 'appsworld2027/parent-plus-ai-org'
        env:
          HANDBOOK_ACCESS: ${{ secrets.AI_ORG_HANDBOOK_SSH_KEY != '' }}
        run: |
          if [ "$HANDBOOK_ACCESS" != true ]; then
            echo "::error::AI Org handbook is private or hidden from the caller token; configure AI_ORG_HANDBOOK_SSH_KEY (read-only deploy key)."
            exit 1
          fi

      - name: Load AI Org handbook
        uses: actions/checkout@v5
        with:
          repository: appsworld2027/parent-plus-ai-org
          ref: ${{ inputs.handbook_ref }}
          path: .ai-org-handbook
          token: ${{ github.token }}
          ssh-key: ${{ github.repository != 'appsworld2027/parent-plus-ai-org' && steps.handbook_visibility.outputs.private == 'true' && secrets.AI_ORG_HANDBOOK_SSH_KEY || '' }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Read item
        id: item
        env:
          STAGE_OVERRIDE: ${{ inputs.stage_override }}
          INPUT_FEATURE_SLUG: ${{ inputs.feature_slug }}
          QUALIFICATION_FIXTURE: ${{ inputs.qualification_fixture }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER" > /tmp/item.json
          jq -r '.body // ""' /tmp/item.json > /tmp/body.md
          TITLE=$(jq -r '.title // ""' /tmp/item.json)
          LABELS=$(jq -r '[.labels[].name] | join(",")' /tmp/item.json)
          STAGE=$(jq -r '[.labels[].name | select(startswith("ai:"))] | first // ""' /tmp/item.json)
          if [ -n "$STAGE_OVERRIDE" ]; then
            if [ "$GITHUB_REPOSITORY" != "appsworld2027/parent-plus-ai-org" ] || [ "$TOOL_MODE" != "readonly" ] || { [ "$STAGE_OVERRIDE" != "ai:discovery" ] && [ "$STAGE_OVERRIDE" != "ai:review" ]; } || [[ ! "$TITLE" =~ ^\[SMOKE\ TEST\] ]]; then
              echo "::error::Synthetic stage override is restricted to read-only AI Org smoke-test issues."
              exit 1
            fi
            if [ "$STAGE_OVERRIDE" = "ai:review" ] && [[ "$TITLE" != "[SMOKE TEST] Reviewer "* ]]; then
              echo "::error::Reviewer smoke requires a dedicated Reviewer smoke issue."
              exit 1
            fi
            STAGE="$STAGE_OVERRIDE"
            LABELS="$STAGE_OVERRIDE"
          fi
          if [ -n "$QUALIFICATION_FIXTURE" ]; then
            if [ "$GITHUB_REPOSITORY" != "appsworld2027/parent-plus-ai-org" ] || [ "$TOOL_MODE" != "readonly" ] || [ -n "$STAGE_OVERRIDE" ] || [ -n "$INPUT_FEATURE_SLUG" ] || [ "$TITLE" != "[ROLE QUALIFICATION] Canonical synthetic benchmark" ] || jq -e 'has("pull_request")' /tmp/item.json >/dev/null; then
              echo "::error::Qualification requires the dedicated synthetic issue in read-only AI Org, without stage or feature override."
              exit 1
            fi
            node .ai-org-handbook/scripts/role-qualification.mjs prepare "$QUALIFICATION_FIXTURE" > /tmp/qualification-input.json
            STAGE=$(jq -er '.stage' /tmp/qualification-input.json)
            LABELS="$STAGE"
            jq -er '.prompt' /tmp/qualification-input.json > /tmp/body.md
          fi
          FEATURE_SLUG="$INPUT_FEATURE_SLUG"
          if [ -z "$FEATURE_SLUG" ]; then
            FEATURE_SLUG=$(sed -nE 's/^[[:space:]]*Feature slug:[[:space:]]*([a-z0-9]+(-[a-z0-9]+)*)[[:space:]]*$/\1/p' /tmp/body.md | head -1)
          fi
          if [ -n "$FEATURE_SLUG" ] && ! [[ "$FEATURE_SLUG" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::Invalid feature slug: $FEATURE_SLUG"
            exit 1
          fi
          echo "labels=$LABELS" >> "$GITHUB_OUTPUT"
          echo "is_pr=$(jq -r 'has("pull_request")' /tmp/item.json)" >> "$GITHUB_OUTPUT"
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "feature_slug=$FEATURE_SLUG" >> "$GITHUB_OUTPUT"

      - name: Route
        id: router
        env:
          LABELS: ${{ steps.item.outputs.labels }}
          QUALIFICATION_FIXTURE: ${{ inputs.qualification_fixture }}
          IS_PR: ${{ steps.item.outputs.is_pr }}
          FEATURE_SLUG: ${{ steps.item.outputs.feature_slug }}
          ENGINE_FREE: ${{ secrets.GROQ_API_KEY != '' || secrets.NVIDIA_NIM_API_KEY != '' }}
          ENGINE_GROQ: ${{ secrets.GROQ_API_KEY != '' }}
          ENGINE_NVIDIA: ${{ secrets.NVIDIA_NIM_API_KEY != '' }}
          TOOL_MODE: ${{ inputs.tool_mode }}
        run: |
          set -euo pipefail
          PRFLAG=""; [ "$IS_PR" = "true" ] && PRFLAG="--pr"
          STAGE=$(printf '%s' "$LABELS" | tr ',' '\n' | grep -m1 '^ai:' || true)
          SEAT=$(case "$STAGE" in ai:tests) echo author;; ai:tests-review) echo challenger;; ai:tests-signoff) echo accountable;; *) echo "";; esac)
          FREE_MODEL_OVERRIDE=$(jq -r --arg s "$STAGE" --arg seat "$SEAT" '(.raci["ai:tests"].models[$seat] // .ai.freeModels[$s]) // ""' .ai-org/manifest.json 2>/dev/null || true)
          export FREE_MODEL_OVERRIDE
          docs_folder=$(node .ai-org-handbook/scripts/product-docs.mjs)
          printf "docs_folder=%s\n" "$docs_folder" >> "$GITHUB_ENV"
          node .ai-org-handbook/scripts/agent-router.mjs --labels "$LABELS" $PRFLAG --tool-mode "$TOOL_MODE" --body-file /tmp/body.md --number "$NUMBER" --repo "$GITHUB_REPOSITORY" | tee /tmp/route.json
          {
            echo "### AI Org router — #$NUMBER"
            echo "Router result:"
            cat /tmp/route.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record task attempt
        if: steps.router.outputs.action == 'run'
        env:
          STAGE: ${{ steps.router.outputs.stage }}
        run: |
          set -euo pipefail
          [[ "$STAGE" =~ ^ai:[a-z-]+$ && "$TOOL_MODE" =~ ^(standard|readonly)$ ]]
          printf '<!-- ai-org:runtime:v1 state=started stage=%s run=%s attempt=%s mode=%s -->\n' "$STAGE" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$TOOL_MODE" > /tmp/runtime-receipt.md
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/runtime-receipt.md
      - name: Prepare the product workspace (dependencies + test browser)
        if: steps.router.outputs.action == 'run' && inputs.tool_mode != 'readonly' && (steps.router.outputs.stage == 'ai:build' || steps.router.outputs.stage == 'ai:fix' || steps.router.outputs.stage == 'ai:qa' || steps.router.outputs.stage == 'ai:tests')
        continue-on-error: true
        run: |
          set -uo pipefail
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund >/tmp/prepare.log 2>&1 && echo "npm ci: OK" || { echo "npm ci failed"; tail -20 /tmp/prepare.log; }; fi
          if [ -f package.json ] && grep -q '"@playwright/test"' package.json; then
            npx playwright install --with-deps chromium >>/tmp/prepare.log 2>&1 && echo "Playwright chromium: OK" || echo "Playwright install failed"
          fi

      - name: Onboarding pack
        if: steps.router.outputs.action == 'run'
        shell: bash --noprofile --norc {0}
        env:
          STAGE: ${{ steps.item.outputs.stage }}
          ROLE: ${{ steps.router.outputs.role }}
          SEAT: ${{ steps.router.outputs.seat }}
          TOOL_MODE: ${{ inputs.tool_mode }}
          FEATURE_SLUG: ${{ steps.item.outputs.feature_slug }}
        run: |
          set -uo pipefail
          mkdir -p /tmp/agent-logs
          ONBOARDING_DIR="$GITHUB_WORKSPACE/.ai-org-runtime"
          mkdir -p "$ONBOARDING_DIR"
          EXCLUDE_FILE="$(git rev-parse --git-path info/exclude)"
          mkdir -p "$(dirname "$EXCLUDE_FILE")"
          touch "$EXCLUDE_FILE"
          grep -qxF '.ai-org-runtime/' "$EXCLUDE_FILE" || printf '\n.ai-org-runtime/\n' >> "$EXCLUDE_FILE"
          ONBOARDING_FILE="$ONBOARDING_DIR/onboarding.md"
          SLUG=$(grep -o 'ai/contract-[a-z0-9-]*' /tmp/body.md | head -1 | sed 's#ai/contract-##' || true)
          if [ -z "$SLUG" ]; then
            SLUG=$(jq -r '.title' /tmp/item.json | sed -nE 's/.*\[([a-z0-9-]+)\]$/\1/p')
          fi
          [ -n "$SLUG" ] || SLUG="$FEATURE_SLUG"
          FEATURE=""
          if [ -n "$SLUG" ] && git ls-remote --exit-code --heads origin "ai/contract-$SLUG" >/dev/null 2>&1; then
            git fetch -q origin "ai/contract-$SLUG" && git worktree add -q -f --detach /tmp/feature-wt "origin/ai/contract-$SLUG" && FEATURE="/tmp/feature-wt/$docs_folder/$SLUG"
          fi
          rm -rf .ai-org-handbook/trial
          SINCE=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          if [ "$TOOL_MODE" = "readonly" ]; then
            : > /tmp/attempt.md
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments?per_page=100" --jq "[.[] | select(.created_at > \"$SINCE\") | select(.body | contains(\"ai-org:failed\"))] | last | .body // \"\"" > /tmp/attempt.md 2>/dev/null || true
          fi
          sed -i -E '/^[[:space:]]*total[[:space:]]+used[[:space:]]/d; /^Mem:/d; /^Swap:/d' /tmp/attempt.md
          printf 'Item #%s, stage %s, seat %s. Start by inspecting issue metadata and body: gh issue view %s --json title,body,labels,assignees. Then follow the role and mode: standard must execute and persist its assigned stage deliverables using authorized tools; readonly returns only the requested report.\n' "$NUMBER" "$STAGE" "${SEAT:-none}" "$NUMBER" > /tmp/task.md
          READONLY_FLAG=""; [ "$TOOL_MODE" = "readonly" ] && READONLY_FLAG="--read-only"
          node .ai-org-handbook/scripts/onboarding-pack.mjs --role "$ROLE" --stage "$STAGE" --slug "$SLUG" --seat "$SEAT" --feature "$FEATURE" --attempt /tmp/attempt.md --task /tmp/task.md --out "$ONBOARDING_FILE" --max 8000 $READONLY_FLAG
          test -s "$ONBOARDING_FILE" || { echo "::error::Onboarding pack was not created."; exit 1; }
          cp "$ONBOARDING_FILE" /tmp/agent-logs/onboarding.md
          echo "onboarding pack: $(wc -c < "$ONBOARDING_FILE") characters for $ROLE ($STAGE, seat ${SEAT:-none}, feature ${SLUG:-none})"
          echo "slug=$SLUG" >> "$GITHUB_ENV"
          CONTRACT_BEFORE=""
          if [ -n "$SLUG" ]; then CONTRACT_BEFORE=$(git rev-parse -q --verify "origin/ai/contract-$SLUG" 2>/dev/null || true); fi
          echo "contract_before=$CONTRACT_BEFORE" >> "$GITHUB_ENV"

      - name: Pause (no engine connected)
        if: steps.router.outputs.action == 'pause'
        env:
          STAGE: ${{ steps.router.outputs.stage }}
          PAUSE_COMMENT: ${{ steps.router.outputs.pause_comment }}
          PAUSE_REASON: ${{ steps.router.outputs.reason }}
        run: |
          set -euo pipefail
          [[ "$STAGE" =~ ^ai:[a-z-]+$ && "$TOOL_MODE" =~ ^(standard|readonly)$ ]]
          {
            printf '<!-- ai-org:runtime:v1 state=blocked stage=%s run=%s attempt=%s mode=%s -->\n' "$STAGE" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$TOOL_MODE"
            printf '%s\n\nRouter: %s\n' "$PAUSE_COMMENT" "$PAUSE_REASON"
            echo "No automatic retry: a required provider or policy approval must be restored."
          } > /tmp/pause.md
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/pause.md
      - name: Record model-execution boundary
        if: steps.router.outputs.action == 'run'
        env:
          STAGE: ${{ steps.router.outputs.stage }}
        run: |
          set -euo pipefail
          [[ "$STAGE" =~ ^ai:[a-z-]+$ && "$TOOL_MODE" =~ ^(standard|readonly)$ ]]
          printf '<!-- ai-org:runtime:v1 state=executing stage=%s run=%s attempt=%s mode=%s -->\n' "$STAGE" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$TOOL_MODE" > /tmp/runtime-receipt.md
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/runtime-receipt.md
      - name: Run agent with the selected free provider (FCC compatibility adapter)
        if: steps.router.outputs.action == 'run' && steps.router.outputs.engine == 'free'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          FREE_MODEL: ${{ steps.router.outputs.free_model }}
          PROMPT: ${{ steps.router.outputs.prompt }}
          EXECUTION_STRATEGY: ${{ steps.router.outputs.execution_strategy }}
          STRATEGY_MAX_TURNS: ${{ steps.router.outputs.strategy_worker_max_turns }}
          STRATEGY_WALL_SECONDS: ${{ steps.router.outputs.strategy_worker_wall_seconds }}
          STRATEGY_OUTPUT_CAP: ${{ steps.router.outputs.strategy_worker_output_cap }}
          STRATEGY_PACKET_COMPLETION_CAP: ${{ steps.router.outputs.strategy_packet_completion_cap }}
          STRATEGY_REVIEW_OUTPUT_CAP: ${{ steps.router.outputs.strategy_worker_review_output_cap }}
          AGENT_NAME: ${{ steps.router.outputs.agent_name }}
          AGENT_ROLE: ${{ steps.router.outputs.agent_role }}
          STAGE: ${{ steps.item.outputs.stage }}
          TOOL_MODE: ${{ inputs.tool_mode }}
          FEATURE_SLUG: ${{ steps.item.outputs.feature_slug }}
          STAGE_OVERRIDE: ${{ inputs.stage_override }}
          QUALIFICATION_FIXTURE: ${{ inputs.qualification_fixture }}
        run: |
          set -uo pipefail
          cd "$GITHUB_WORKSPACE"
          test -s .ai-org-runtime/onboarding.md || { echo "::error::Workspace onboarding pack is missing; refusing to start the model."; exit 1; }
          mkdir -p /tmp/agent-logs
          [ "$EXECUTION_STRATEGY" = "free-packeted" ] || { echo "::error::Invalid execution strategy for free worker."; exit 1; }
          [[ "$STRATEGY_MAX_TURNS" =~ ^[1-9][0-9]{0,2}$ && "$STRATEGY_WALL_SECONDS" =~ ^[1-9][0-9]{0,3}$ && "$STRATEGY_OUTPUT_CAP" =~ ^[1-9][0-9]{0,2}$ && "$STRATEGY_REVIEW_OUTPUT_CAP" =~ ^[1-9][0-9]{0,2}$ ]] || { echo "::error::Missing or invalid trusted strategy ceilings."; exit 1; }
          [ "$STRATEGY_MAX_TURNS" -le 150 ] && [ "$STRATEGY_WALL_SECONDS" -le 5400 ] || { echo "::error::Strategy bounds exceeded."; exit 1; }
          MODEL_ROUTE="$FREE_MODEL"
          EFFORT=""
          case "$MODEL_ROUTE" in *@*) EFFORT="${MODEL_ROUTE##*@}"; MODEL_ROUTE="${MODEL_ROUTE%@*}";; esac
          PROVIDER="${MODEL_ROUTE%%/*}"
          MODEL_ID="${MODEL_ROUTE#*/}"
          MODEL_FALLBACK=false
          PROBE_REASON=""
          configure_provider() {
            case "$PROVIDER" in
              groq)
                API_KEY="$GROQ_API_KEY"
                API_URL="https://api.groq.com/openai/v1/chat/completions"
                FCC_MODEL="$MODEL_ROUTE"
                ;;
              nvidia)
                API_KEY="$NVIDIA_NIM_API_KEY"
                API_URL="https://integrate.api.nvidia.com/v1/chat/completions"
                FCC_MODEL="nvidia_nim/$MODEL_ID"
                ;;
              *)
                echo "::error::Unapproved free provider route: $PROVIDER"
                return 1
                ;;
            esac
            [ -n "$API_KEY" ] || { echo "::error::$PROVIDER free-provider key is unavailable."; return 1; }
          }
          NATIVE_PILOT=false
          if [ "$FREE_MODEL" = groq/openai/gpt-oss-120b ] && [ "$STAGE" = ai:discovery ] && [ "$TOOL_MODE" = standard ] && [ "$GITHUB_REPOSITORY" = appsworld2027/parent-plus-ai-org ] && [ "$NUMBER" = 170 ] && [ "$FEATURE_SLUG" = f010-quality-drift ] && [ "$GITHUB_REF_NAME" = audit/f010-pilot-20261128 ] && [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            NATIVE_PILOT=true
          fi
          probe_provider() {
            PROBE_REASON=""
            if [ "$NATIVE_PILOT" = true ]; then
              jq -n --arg model "$MODEL_ID" '{model:$model,messages:[{role:"user",content:"Return only the JSON object {\"ready\":true}."}],response_format:{type:"json_object"},reasoning_effort:"low",max_completion_tokens:512}' > "/tmp/agent-logs/$PROVIDER-probe-request.json"
            else
              jq -n --arg model "$MODEL_ID" '{
              model:$model,
              messages:[{role:"user",content:"Call the report_ready tool with ready=true now."}],
              tools:[{type:"function",function:{name:"report_ready",description:"Report that the model can call tools.",parameters:{type:"object",properties:{ready:{type:"boolean"}},required:["ready"],additionalProperties:false}}}],
              tool_choice:"required",
              max_tokens:80
            }' > "/tmp/agent-logs/$PROVIDER-probe-request.json"
            fi
            HTTP_STATUS=$(curl -sS --max-time 120 -D "/tmp/agent-logs/$PROVIDER-probe.headers" -o "/tmp/agent-logs/$PROVIDER-probe-response.json" -w '%{http_code}' \
              -H "Authorization: Bearer $API_KEY" -H "Content-Type: application/json" \
              --data-binary @"/tmp/agent-logs/$PROVIDER-probe-request.json" "$API_URL")
            if [ "$HTTP_STATUS" != "200" ]; then
              if [ "$HTTP_STATUS" = "429" ] || [[ "$HTTP_STATUS" =~ ^5 ]]; then
                touch "/tmp/agent-logs/$PROVIDER-probe-retryable"
              fi
              jq -r '.error.message // "Provider request failed."' "/tmp/agent-logs/$PROVIDER-probe-response.json" 2>/dev/null | cut -c1-300 || true
              return 1
            fi
            if [ "$NATIVE_PILOT" = true ]; then
              if ! jq -e --arg model "$MODEL_ID" '(.model == $model) and (.choices[0].finish_reason == "stop") and ((.choices[0].message.tool_calls // []) | length == 0) and ((.choices[0].message.content | fromjson) == {ready:true})' "/tmp/agent-logs/$PROVIDER-probe-response.json" >/dev/null; then
                PROBE_REASON="invalid-native-json"
                return 1
              fi
            elif ! jq -e '.choices[0].message.tool_calls | length > 0' "/tmp/agent-logs/$PROVIDER-probe-response.json" >/dev/null; then
              PROBE_REASON="no-tool-call"
              return 1
            fi
            return 0
          }
          configure_provider || exit 1
          if ! probe_provider; then
            if [ "$PROVIDER" = "nvidia" ] && [ -n "$GROQ_API_KEY" ] && { [ "$HTTP_STATUS" = "429" ] || [ "$HTTP_STATUS" = "000" ] || [[ "$HTTP_STATUS" =~ ^5 ]] || [ "$PROBE_REASON" = "no-tool-call" ]; }; then
              echo "NVIDIA free endpoint unavailable for this turn; retrying once on the approved Groq free builder."
              MODEL_ROUTE="groq/openai/gpt-oss-120b"
              PROVIDER="groq"
              MODEL_ID="openai/gpt-oss-120b"
              MODEL_FALLBACK=true
              configure_provider || exit 1
              probe_provider || { echo "::error::Approved Groq free fallback also failed; no paid fallback attempted."; exit 1; }
            else
              echo "::error::$PROVIDER free-model preflight failed (HTTP ${HTTP_STATUS:-unknown}); no agent was started and no paid fallback was attempted."
              exit 1
            fi
          fi
          FREE_MODEL="$MODEL_ROUTE"
          jq --arg model "$MODEL_ROUTE" --arg provider "$PROVIDER" --argjson fallback "$MODEL_FALLBACK" '.free_model=$model | .free_provider=$provider | .model_fallback=$fallback' /tmp/route.json > /tmp/route.json.tmp
          mv /tmp/route.json.tmp /tmp/route.json
          if [ "$NATIVE_PILOT" = true ]; then echo "Free provider native JSON preflight: PASS ($PROVIDER/$MODEL_ID)"; else echo "Free provider tool-call preflight: PASS ($PROVIDER/$MODEL_ID)"; fi
          # One explicitly admitted pilot uses native JSON output, without the incompatible FCC tool wrapper.
          if [ "$NATIVE_PILOT" = true ]; then
            [ "$GITHUB_REPOSITORY" = appsworld2027/parent-plus-ai-org ] && [ "$NUMBER" = 170 ] && [ "$FEATURE_SLUG" = f010-quality-drift ] || exit 1
            BRANCH="ai/contract-$FEATURE_SLUG"
            REMOTE_CONTRACT=$(git ls-remote --heads origin "refs/heads/$BRANCH") || exit 1
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments?per_page=100" | jq -s 'add // []' > /tmp/discovery-comments-before.json || { echo "::error::Discovery baseline comments unavailable"; exit 1; }
            jq -e 'type == "array"' /tmp/discovery-comments-before.json >/dev/null || exit 1
            NATIVE_ROOT="$GITHUB_WORKSPACE"
            NATIVE_REVISION_BASE=""
            if [ -z "$REMOTE_CONTRACT" ]; then
              git fetch --no-tags origin refs/heads/main && git switch -c "$BRANCH" FETCH_HEAD || exit 1
            else
              NATIVE_REVISION_BASE=229d47675217a1f640ef88a41b97c28117988657
              [ "$(printf '%s\n' "$REMOTE_CONTRACT" | cut -f1)" = "$NATIVE_REVISION_BASE" ] || { echo "::error::Unreconciled contract branch; manual review required."; exit 1; }
              git fetch --no-tags origin "refs/heads/$BRANCH" && [ "$(git rev-parse FETCH_HEAD)" = "$NATIVE_REVISION_BASE" ] && git switch -c "$BRANCH" FETCH_HEAD || exit 1
              NATIVE_ROOT=$(mktemp -d) || exit 1
            fi
            export NATIVE_REVISION_BASE
            git config user.name "$AGENT_NAME (AppsWorld AI Org)"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            date -u +%Y-%m-%dT%H:%M:%SZ > /tmp/agent-logs/started-at
            DIRECTORY="$docs_folder/$FEATURE_SLUG"
            native_content_matches() {
              for doc in SUMMARY.md ACCEPTANCE.md PRODUCT_THINKING.md; do
                expected=$(jq -er --arg doc "$doc" '.[$doc]' /tmp/agent-logs/native-content-sha.json) || return 1
                actual=$(sha256sum "$DIRECTORY/$doc" | cut -d" " -f1) || return 1
                [ "$expected" = "$actual" ] || return 1
              done
            }
            if timeout "$STRATEGY_WALL_SECONDS" node .ai-org-handbook/scripts/discovery-native.mjs /tmp/body.md .ai-org-runtime/onboarding.md .ai-org-handbook/.ai/skills/superpowers/brainstorming/SKILL.md .ai-org-handbook/templates/PRODUCT_THINKING.md "$GITHUB_REPOSITORY" "$NUMBER" "$FEATURE_SLUG" "$docs_folder" "$BRANCH" "$NATIVE_ROOT" /tmp/agent-logs "$STRATEGY_PACKET_COMPLETION_CAP" 2>&1 | tee /tmp/agent-logs/native-run.txt &&
              git diff --cached --quiet &&
              { [ -z "$NATIVE_REVISION_BASE" ] || { [ "$(git rev-parse HEAD)" = "$NATIVE_REVISION_BASE" ] && git diff --quiet -- "$DIRECTORY" && cp -- "$NATIVE_ROOT/$DIRECTORY/SUMMARY.md" "$NATIVE_ROOT/$DIRECTORY/ACCEPTANCE.md" "$NATIVE_ROOT/$DIRECTORY/PRODUCT_THINKING.md" "$DIRECTORY/"; }; } &&
              native_content_matches &&
              git add -- "$DIRECTORY/SUMMARY.md" "$DIRECTORY/ACCEPTANCE.md" "$DIRECTORY/PRODUCT_THINKING.md" &&
              git commit -m "docs: Maya native discovery contract for $FEATURE_SLUG" &&
              git push origin "HEAD:refs/heads/$BRANCH" &&
              gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/agent-logs/discovery-native-report.md; then
              echo "Verified model-authored native outputs published; remote completion verifier remains mandatory."
              exit 0
            else
              touch /tmp/agent-logs/incomplete
              echo "::error::Native discovery generation or publication incomplete; reconcile before retry."
              exit 1
            fi
          fi
          curl -LsSf https://astral.sh/uv/install.sh | sh >/dev/null
          export PATH="$HOME/.local/bin:$PATH"
          uv tool install "free-claude-code==6.19.56" >/dev/null
          npm install -g @anthropic-ai/claude-code >/dev/null
          mkdir -p "$HOME/.fcc" "$HOME/.claude"
          if [ "$PROVIDER" = "groq" ]; then
            printf 'GROQ_API_KEY=%s\nMODEL=%s\nHTTP_READ_TIMEOUT=600\nFCC_OPEN_BROWSER=false\n' "$GROQ_API_KEY" "$FCC_MODEL" > "$HOME/.fcc/.env"
          else
            printf 'NVIDIA_NIM_API_KEY=%s\nMODEL=%s\nHTTP_READ_TIMEOUT=600\nFCC_OPEN_BROWSER=false\n' "$NVIDIA_NIM_API_KEY" "$FCC_MODEL" > "$HOME/.fcc/.env"
          fi
          [ -n "$EFFORT" ] && printf 'REASONING_POLICY=%s\n' "$EFFORT" >> "$HOME/.fcc/.env" && echo "reasoning effort: $EFFORT"
          chmod 600 "$HOME/.fcc/.env"
          echo '{"includeCoAuthoredBy": false}' > "$HOME/.claude/settings.json"
          # The adapter reads its protected env file; do not pass provider keys into the agent shell.
          unset GROQ_API_KEY NVIDIA_NIM_API_KEY API_KEY
          nohup fcc-server > /tmp/agent-logs/fcc.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8082/v1/models && break; sleep 1; done
          git config user.name "$AGENT_NAME (AppsWorld AI Org)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Embed the bounded onboarding pack directly in the initial prompt; the agent sandbox cannot read /tmp paths.
          PROMPT="$(printf '%s\\n\\n## Compact onboarding pack\\n' "$PROMPT"; cat .ai-org-runtime/onboarding.md)"
          if [ "$TOOL_MODE" = "readonly" ]; then
            [ "$(wc -c < /tmp/body.md)" -le 12000 ] || { echo "::error::Read-only issue body exceeds bounded prompt size."; exit 1; }
            PROMPT="$(printf '%s\n\n## Authoritative current task: issue #%s\n' "$PROMPT" "$NUMBER"; cat /tmp/body.md; printf '\n\nUse this exact task body as the source of truth. Do not substitute another issue, and report only findings about this task. If reviewing, start with a separate Verdict: APPROVE or Verdict: REJECT line, then give concise evidence. Return only an assistant report; do not use tools to publish it.\n')"
          fi
          PROMPT="$PROMPT
          7. Engine facts: you are running on model $FREE_MODEL, served by the $PROVIDER free endpoint through the Free Claude Code compatibility adapter. This is not Claude inference or a paid model. Whenever you name the model or engine that did the work (comments, commits, PRs), state the exact provider and model.
          8. Normal work: use --body-file for comments and PR bodies. Read-only mode: never write or post comments. Return the final assistant report directly; the workflow publishes it. Keep the report concise.
          9. Feature slug: $FEATURE_SLUG. Never use literal _none_. If no feature slug is assigned, do not create a handoff.
          10. Do not change issue stage labels or issue state; the workflow owns stage transitions.
          11. Evidence rule: every claim that checks passed must link a CI run or quote the command and its result line."
          if [ -f .ai-org/manifest.json ] && jq -e '.governance.autoMerge == false' .ai-org/manifest.json >/dev/null; then
            PROMPT="$PROMPT
          12. This repository forbids agents from merging. Never run gh pr merge or enable auto-merge here; open the PR and stop."
          fi
          [ -d node_modules ] && PROMPT="$PROMPT
          13. Dependencies (node_modules) and the Playwright Chromium browser are already installed. Do not reinstall them and do not read dependency source code."
          if [ "$TOOL_MODE" = "readonly" ]; then
            PROMPT="$PROMPT
          8. Reporting: provide a concise final report in your assistant response. The workflow publishes it as the issue comment; do not attempt GitHub writes or shell commands."
          fi
          case "$TOOL_MODE" in
            readonly)
              TOOLS="Bash,Read"
              ALLOWED_TOOLS="Read,Bash(grep:*),Bash(sed:*),Bash(gh issue view:*),Bash(git status:*),Bash(pwd:*),Bash(head:*),Bash(tail:*),Bash(wc:*)"
              ;;
            standard)
              TOOLS="Bash,Read,Edit,Write,Glob,Grep"
              ALLOWED_TOOLS="$TOOLS"
              if [ "$STAGE" = "ai:discovery" ]; then TOOLS="$TOOLS,WebSearch,WebFetch"; ALLOWED_TOOLS="$TOOLS"; fi
              ;;
            *)
              echo "::error::Unsupported tool mode: $TOOL_MODE"
              exit 1
              ;;
          esac
          OUTPUT_TOKEN_CAP="$STRATEGY_OUTPUT_CAP"
          if [ "$TOOL_MODE" = "readonly" ] && { [[ "$STAGE_OVERRIDE" =~ ^ai:(discovery|review)$ ]] || [ -n "$QUALIFICATION_FIXTURE" ]; }; then
            # The authoritative synthetic issue body is already embedded.
            TOOLS=""; ALLOWED_TOOLS=""
            PROMPT="$PROMPT
            Return a concise report from the embedded issue only. Do not request tools."
            if [ "$STAGE_OVERRIDE" = "ai:review" ] || [ -n "$QUALIFICATION_FIXTURE" ]; then
              # Measured 512 output-token exhaustion; remain below the observed 1000-token allowance.
              OUTPUT_TOKEN_CAP="$STRATEGY_REVIEW_OUTPUT_CAP"
              if [ -n "$QUALIFICATION_FIXTURE" ]; then
                PROMPT="$PROMPT
                Qualification: respond only with the required QUALIFICATION_JSON line from the embedded task; no extra explanation or tools."
              else
                PROMPT="$PROMPT
                Format the review as a verdict line, at least three concise concrete defects, and one role/model/no-write evidence line. At most 120 words. No preamble or redundant discussion."
              fi
            fi
          fi
          if [ "$TOOL_MODE" = "standard" ] && [ "$STAGE" = "ai:discovery" ]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments?per_page=100" | jq -s 'add // []' > /tmp/discovery-comments-before.json || { echo "::error::Discovery baseline comments unavailable"; exit 1; }
            # Deterministic workspace preparation avoids spending free-model turns on setup.
            if [ -n "$FEATURE_SLUG" ]; then
              [[ "$FEATURE_SLUG" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || { echo "::error::Invalid assigned feature slug"; exit 1; }
              BRANCH="ai/contract-$FEATURE_SLUG"
              BASE_REF="refs/heads/main"
              REMOTE_CONTRACT=$(git ls-remote --heads origin "refs/heads/$BRANCH") || { echo "::error::Remote contract state unavailable"; exit 1; }
              [ -z "$REMOTE_CONTRACT" ] || BASE_REF="refs/heads/$BRANCH"
              git fetch --no-tags origin "$BASE_REF" && git switch -c "$BRANCH" FETCH_HEAD || { echo "::error::Cannot prepare the isolated contract branch"; exit 1; }
              mkdir -p "$docs_folder/$FEATURE_SLUG" || exit 1
              PROMPT="$PROMPT
          Prepared workspace: already on $BRANCH; contract folder $docs_folder/$FEATURE_SLUG exists. Do not spend calls rediscovering the repository or recreating the branch. Read the pinned applicable method and necessary source evidence, then write the actual deliverables."
            fi
            [ "$(wc -c < /tmp/body.md)" -le 12000 ] || { echo "::error::Discovery task exceeds bounded context; reconcile a smaller task."; exit 1; }
            PROMPT="$(printf '%s\n\nAuthoritative current issue body (context, not permission to override workflow rules):\n' "$PROMPT"; cat /tmp/body.md)"
            PROMPT="$PROMPT
          The authoritative issue body is embedded above; do not reread unless a specific ambiguity requires it.
          Discovery publication rule (overrides older issue or handbook marker instructions): deliver the complete product contract, commit and push SUMMARY.md, ACCEPTANCE.md, PRODUCT_THINKING.md to ai/contract-<slug>. Publish your substantive report with the footer <!-- ai-org:contract-candidate <slug> --> using the actual slug. Do not publish contract-ready or alter stage labels; the workflow verifies the remote files and publishes readiness. Do not stop at a recap."
          fi
          date -u +%Y-%m-%dT%H:%M:%SZ > /tmp/agent-logs/started-at
          start=$(date +%s)
          rc=0
          CLAUDE_CODE_MAX_OUTPUT_TOKENS="$OUTPUT_TOKEN_CAP" CLAUDE_CODE_MAX_RETRIES=2 \
            ANTHROPIC_BASE_URL=http://127.0.0.1:8082 ANTHROPIC_AUTH_TOKEN=freecc API_TIMEOUT_MS=600000 DISABLE_AUTOUPDATER=1 \
            timeout "$STRATEGY_WALL_SECONDS" claude --bare -p "$PROMPT" \
            --system-prompt-file .ai-org-handbook/governance/FREE_AGENT_SYSTEM_PROMPT.md \
            --tools "$TOOLS" --allowedTools "$ALLOWED_TOOLS" --max-turns "$STRATEGY_MAX_TURNS" \
            --output-format stream-json --verbose > /tmp/agent-logs/agent.jsonl 2> /tmp/agent-logs/agent.stderr || rc=$?
          RESULT=$(node .ai-org-handbook/scripts/classify-worker-result.mjs "$rc" /tmp/agent-logs/agent.jsonl /tmp/agent-logs/agent.stderr "$TOOL_MODE")
          rc=$(jq -er '.exitCode' <<< "$RESULT")
          KIND=$(jq -er '.kind' <<< "$RESULT")
          case "$KIND" in
            incomplete)
              touch /tmp/agent-logs/incomplete
              echo "::error::Standard agent exited without invoking tools; no stage work proven."
              ;;
            output-limit)
              touch /tmp/agent-logs/output-limit
              echo "Free-provider output ceiling exhausted; revise the bounded report before retrying." | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            request-too-large)
              touch /tmp/agent-logs/request-too-large
              echo "Free-provider input allowance exceeded; reduce context before retrying." | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            transient-quota)
              if [ "$TOOL_MODE" = "readonly" ]; then
                touch "/tmp/agent-logs/$PROVIDER-probe-retryable"
              else
                # Execution boundary crossed; never blindly replay possible partial writes.
                touch /tmp/agent-logs/execution-interrupted
              fi
              ;;
          esac
          secs=$(( $(date +%s) - start ))
          stats=$(jq -r 'select(.type=="result") | "turns=\(.num_turns) subtype=\(.subtype) is_error=\(.is_error)"' /tmp/agent-logs/agent.jsonl 2>/dev/null | tail -1)
          final=$(jq -r 'select(.type=="result") | .result // ""' /tmp/agent-logs/agent.jsonl 2>/dev/null | tail -c 3000)
          {
            echo "### Free engine run — $AGENT_NAME on $FREE_MODEL — exit $rc in $secs seconds — $stats"
            echo "Router and final response are available in the artifacts."
            printf '%s\n' "$final"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "AGENT_RESULT exit=$rc secs=$secs $stats"
          printf '%s\n' "$final" | tail -c 3000
          tail -c 1500 /tmp/agent-logs/agent.stderr
          exit $rc

      - name: Score synthetic role qualification
        if: success() && inputs.qualification_fixture != '' && inputs.tool_mode == 'readonly' && steps.router.outputs.action == 'run'
        env:
          QUALIFICATION_FIXTURE: ${{ inputs.qualification_fixture }}
        run: |
          node .ai-org-handbook/scripts/role-qualification.mjs score "$QUALIFICATION_FIXTURE" /tmp/agent-logs/agent.jsonl /tmp/route.json "$(git -C .ai-org-handbook rev-parse HEAD)" > /tmp/qualification-result.json
      - name: Publish synthetic qualification result
        if: always() && inputs.qualification_fixture != ''
        uses: actions/upload-artifact@v4
        with:
          name: ai-org-qualification-${{ github.run_attempt }}
          path: /tmp/qualification-result.json
          if-no-files-found: ignore
      - name: Publish and verify read-only completion report
        if: success() && inputs.tool_mode == 'readonly' && steps.router.outputs.action == 'run'
        env:
          NUMBER: ${{ inputs.number }}
          AGENT_NAME: ${{ steps.router.outputs.agent_name }}
          AGENT_ROLE: ${{ steps.router.outputs.agent_role }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STARTED_AT=$(cat /tmp/agent-logs/started-at)
          STARTED_EPOCH=$(date -d "$STARTED_AT" +%s)
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          MARKER="[$AGENT_NAME — $AGENT_ROLE]"
          RECEIPT="Run: $RUN_URL (attempt $GITHUB_RUN_ATTEMPT)"
          has_report() {
            gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments?per_page=100" | jq -e --arg marker "$MARKER" --arg receipt "$RECEIPT" --argjson started "$STARTED_EPOCH" 'def epoch: sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601; any(.[]; .user.login == "github-actions[bot]" and (.body | startswith($marker) and contains($receipt)) and ((.created_at | epoch) >= $started))' >/dev/null
          }
          if ! has_report; then
            REPORT=$(node .ai-org-handbook/scripts/extract-readonly-report.mjs /tmp/agent-logs/agent.jsonl) || { echo "::error::Read-only report extraction failed."; exit 1; }
            [ -n "$REPORT" ] || { echo "::error::No final assistant report was available to publish."; exit 1; }
            REPORT=$(printf '%s\n\n%s\n\n%s' "$MARKER" "$REPORT" "$RECEIPT")
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$REPORT"
          fi
          has_report || { echo "::error::Workflow could not verify its read-only report comment."; exit 1; }
          if [ "${{ inputs.stage_override }}" = "ai:review" ]; then
            REVIEW=$(gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments?per_page=100" | jq -er --arg marker "$MARKER" --arg receipt "$RECEIPT" '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith($marker) and contains($receipt)))][-1].body')
            # Synthetic fixture: a correct rejection must address the actual registration rule.
            printf '%s' "$REVIEW" | grep -Eiq '^[[:space:]]*(#{1,6}[[:space:]]+)?[[:space:]*-]*Verdict:[[:space:]*]*REJECT([[:space:]*.!]|$)' || { echo "::error::Synthetic reviewer did not reject the flawed rule."; exit 1; }
            if printf '%s' "$REVIEW" | grep -Eiq '^[[:space:]]*(#{1,6}[[:space:]]+)?[[:space:]*-]*Verdict:[[:space:]*]*APPROVE([[:space:]*.!]|$)'; then echo "::error::Synthetic reviewer produced contradictory verdicts."; exit 1; fi
            for term in registration email password duplicate; do
              printf '%s' "$REVIEW" | grep -iq "$term" || { echo "::error::Synthetic reviewer omitted fixture term: $term"; exit 1; }
            done
          fi
          echo "Published and verified the read-only agent report."

      - name: Export free-model worker usage
        if: always() && steps.router.outputs.action == 'run' && steps.router.outputs.engine == 'free'
        run: |
          if [ -f /tmp/agent-logs/agent.jsonl ]; then
            node "$GITHUB_WORKSPACE/.ai-org-handbook/scripts/worker-usage.mjs" /tmp/agent-logs/agent.jsonl /tmp/route.json /tmp/ai-org-usage.json
          fi

      - name: Publish worker usage
        if: always() && steps.router.outputs.action == 'run' && steps.router.outputs.engine == 'free'
        uses: actions/upload-artifact@v4
        with:
          name: ai-org-usage-${{ github.run_attempt }}
          path: /tmp/ai-org-usage.json
          if-no-files-found: ignore

      - name: Acceptance-test gate (ai:tests only)
        if: always() && steps.router.outputs.action == 'run' && inputs.tool_mode != 'readonly' && steps.router.outputs.stage == 'ai:tests'
        shell: bash --noprofile --norc {0}
        run: |
          set -uo pipefail
          PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --search "Closes #$NUMBER in:body" --json number,headRefName,headRefOid -q '.[0] // empty')
          [ -n "$PR" ] || { echo "No open contract PR for #$NUMBER yet - nothing to grade"; exit 0; }
          PRN=$(jq -r .number <<<"$PR"); BR=$(jq -r .headRefName <<<"$PR"); SHA=$(jq -r .headRefOid <<<"$PR")
          git fetch -q origin "$BR" main && git checkout -q -f --detach "$SHA" && git clean -qfd -e node_modules
          LOCKED=$(jq -r '.loop.lockedPaths // "e2e/acceptance/"' .ai-org/manifest.json); SLUG=${BR#ai/contract-}
          SPEC=$(git diff --name-only origin/main...HEAD -- "$LOCKED" | grep -E '\.(spec|test)\.[cm]?[jt]sx?$' | head -1)
          if [ -z "$SPEC" ]; then printf '### Acceptance-test gate: FAIL\n\nNo new locked spec in %s on %s.\n' "$LOCKED" "$BR" > /tmp/gate.md; g=1
          else
            npx tsc --noEmit >/tmp/agent-logs/gate-tsc.txt 2>&1; tsc=$?
            npx playwright test "$SPEC" --reporter=json --timeout=20000 --workers=2 > /tmp/agent-logs/gate-report.json 2>/tmp/agent-logs/gate-pw.txt || true
            node .ai-org-handbook/scripts/grade-acceptance.mjs --spec "$SPEC" --report /tmp/agent-logs/gate-report.json --contract "$docs_folder/$SLUG/ACCEPTANCE.md" --src src --tsc-exit "$tsc" --md /tmp/gate.md >/dev/null; g=$?
          fi
          cat /tmp/gate.md | tee -a "$GITHUB_STEP_SUMMARY"
          { echo "<!-- ai-org:gate $SHA -->"; echo "Acceptance-test gate on ${SHA:0:7}"; echo; cat /tmp/gate.md; } > /tmp/gate-comment.md
          gh pr comment "$PRN" --repo "$GITHUB_REPOSITORY" --body-file /tmp/gate-comment.md >/dev/null
          STATE=$([ "$g" = 0 ] && echo success || echo failure)
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$STATE" -f context=acceptance-gate -f description="$(head -1 /tmp/gate.md | sed 's/^### //' | cut -c1-130)" >/dev/null
          echo "acceptance-gate = $STATE on ${SHA:0:7}"

      - name: Handover check
        env:
          STAGE: ${{ steps.item.outputs.stage }}
        if: steps.router.outputs.action == 'run' && inputs.tool_mode != 'readonly' && startsWith(steps.router.outputs.stage, 'ai:tests')
        shell: bash --noprofile --norc {0}
        run: |
          set -uo pipefail
          [ -n "${slug:-}" ] || { echo "no feature slug - handover check skipped"; exit 0; }
          git fetch -q origin "ai/contract-$slug" 2>/dev/null || { echo "no contract branch - handover check skipped"; exit 0; }
          FROM=${contract_before:-$GITHUB_SHA}
          NEW=$(git diff --name-only --diff-filter=A "$FROM" "origin/ai/contract-$slug" -- "$docs_folder/$slug/handoffs/" 2>/dev/null | sort | tail -1)
          ok=1
          if [ -z "$NEW" ]; then echo "::error::No handover packet was committed to $docs_folder/$slug/handoffs/ by this run"; ok=0
          else
            git show "origin/ai/contract-$slug:$NEW" > /tmp/handoff.md
            node .ai-org-handbook/scripts/handoff.mjs validate /tmp/handoff.md | tee -a "$GITHUB_STEP_SUMMARY" /tmp/agent-logs/handover.txt; [ "${PIPESTATUS[0]}" = 0 ] || ok=0
          fi
          if [ "$ok" = 1 ]; then
            gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$STAGE" >/dev/null 2>&1 || true
          else
            gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --add-label ai:blocked >/dev/null 2>&1 || true
            exit 1
          fi

      - name: Verify and publish discovery output
        if: success() && steps.router.outputs.action == 'run' && inputs.tool_mode == 'standard' && steps.router.outputs.stage == 'ai:discovery'
        env:
          FEATURE_SLUG: ${{ steps.item.outputs.feature_slug }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments?per_page=100" | jq -s 'add // []' > /tmp/discovery-comments-after.json || { touch /tmp/agent-logs/incomplete; exit 1; }
          node .ai-org-handbook/scripts/verify-discovery-output.mjs /tmp/discovery-comments-before.json /tmp/discovery-comments-after.json "$FEATURE_SLUG" /tmp/discovery-verified-report.md "$docs_folder" > /tmp/agent-logs/discovery-proof.json || { cat /tmp/agent-logs/discovery-proof.json; touch /tmp/agent-logs/incomplete; exit 1; }
          cat /tmp/agent-logs/discovery-proof.json | tee -a "$GITHUB_STEP_SUMMARY"
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/discovery-verified-report.md || { touch /tmp/agent-logs/incomplete; exit 1; }
      - name: Save agent logs
        if: always() && steps.router.outputs.action == 'run'
        uses: actions/upload-artifact@v4
        with:
          name: agent-logs-${{ inputs.number }}-${{ github.run_attempt }}
          path: /tmp/agent-logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Record completed attempt
        if: success() && steps.router.outputs.action == 'run'
        env:
          STAGE: ${{ steps.router.outputs.stage }}
        run: |
          set -euo pipefail
          [[ "$STAGE" =~ ^ai:[a-z-]+$ && "$TOOL_MODE" =~ ^(standard|readonly)$ ]]
          printf '<!-- ai-org:runtime:v1 state=completed stage=%s run=%s attempt=%s mode=%s -->\n' "$STAGE" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$TOOL_MODE" > /tmp/runtime-receipt.md
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/runtime-receipt.md
      - name: Report a failed run
        if: failure() && steps.router.outputs.action == 'run'
        env:
          STAGE: ${{ steps.router.outputs.stage }}
          AGENT_NAME: ${{ steps.router.outputs.agent_name }}
          AGENT_ROLE: ${{ steps.router.outputs.agent_role }}
          FREE_MODEL: ${{ steps.router.outputs.free_model }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          STATE="failed"
          if [ -f /tmp/agent-logs/incomplete ]; then
            MARKER="ai-org:failed"; STATE="blocked"
            SUMMARY="The agent did not produce verifiable stage deliverables. Reconcile partial writes and missing evidence; no automatic replay or ready receipt."
          elif [ -f /tmp/agent-logs/output-limit ]; then
            MARKER="ai-org:failed"; STATE="blocked"
            SUMMARY="The free-model output ceiling was exhausted. Reconcile the attempt and reduce report scope before retrying. No paid fallback was attempted."
          elif [ -f /tmp/agent-logs/request-too-large ]; then
            MARKER="ai-org:failed"; STATE="blocked"
            SUMMARY="The approved free model rejected the request size. Reduce context and reconcile the exact attempt before retrying. No paid fallback was attempted."
          elif [ -f /tmp/agent-logs/execution-interrupted ]; then
            MARKER="ai-org:failed"; STATE="blocked"
            SUMMARY="Free-provider quota interrupted execution after possible writes. Reconcile workspace and branch evidence before retrying."
          elif [ -f /tmp/agent-logs/groq-probe-retryable ] || [ -f /tmp/agent-logs/nvidia-probe-retryable ]; then
            MARKER="ai-org:paused"
            SUMMARY="An approved free-provider endpoint is temporarily unavailable. No paid fallback was attempted. The hourly resume workflow will retry."
          else
            MARKER="ai-org:failed"
            SUMMARY="The run failed after starting the free-model execution path. It is not retried automatically; the next attempt reads this note first."
          fi
          {
            [[ "$STAGE" =~ ^ai:[a-z-]+$ && "$TOOL_MODE" =~ ^(standard|readonly)$ ]] || exit 1
            [ "$MARKER" = "ai-org:paused" ] && STATE="paused"
            printf '<!-- ai-org:runtime:v1 state=%s stage=%s run=%s attempt=%s mode=%s -->\n' "$STATE" "$STAGE" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$TOOL_MODE"
            printf '<!-- %s -->\n' "$MARKER"
            ACTUAL_MODEL=$(jq -r '.free_model // empty' /tmp/route.json 2>/dev/null || true)
            [ -n "$ACTUAL_MODEL" ] || ACTUAL_MODEL="$FREE_MODEL"
            printf '%s\n' "**[$AGENT_NAME — $AGENT_ROLE] Run did not complete on approved free route ($ACTUAL_MODEL). Logs: $RUN_URL (artifact agent-logs-$NUMBER-${{ github.run_attempt }})." ""
            echo "$SUMMARY"
            echo "What the next attempt must know (attempt memory):"
            grep -h "AGENT_RESULT\|handover INVALID\|^- " /tmp/agent-logs/*.txt 2>/dev/null | head -10
            jq -r 'select(.type=="assistant") | .message.content[]? | select(.type=="text") | .text' /tmp/agent-logs/agent.jsonl 2>/dev/null | tail -c 1200
          } > /tmp/failed.md
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/failed.md

      - name: Chain to the next agent if the stage changed
        if: steps.router.outputs.action == 'run' && inputs.tool_mode != 'readonly'
        env:
          BEFORE: ${{ steps.item.outputs.stage }}
          WORKFLOW: ${{ inputs.dispatch_workflow }}
          HANDBOOK_REF: ${{ inputs.handbook_ref }}
        run: |
          set -euo pipefail
          AFTER=$(gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER" --jq '[.labels[].name | select(startswith("ai:"))] | first // ""')
          echo "stage before: ${BEFORE:-none}  after: ${AFTER:-none}" | tee -a "$GITHUB_STEP_SUMMARY"
          # A manually dispatched candidate must never switch to main or advance unrelated work.
          if [ "$GITHUB_REPOSITORY" = appsworld2027/parent-plus-ai-org ] && [ "$HANDBOOK_REF" != main ]; then
            if [ -n "$AFTER" ] && [ "$AFTER" != "$BEFORE" ]; then
              CURRENT=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')
              [ "$CURRENT" = "$HANDBOOK_REF" ] || { echo "Pinned candidate moved; stop chain"; exit 1; }
              gh workflow run "$WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f number="$NUMBER"
              echo "Dispatched pinned candidate for #$NUMBER ($AFTER)" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi
          if [ -n "$AFTER" ] && [ "$AFTER" != "$BEFORE" ]; then
            gh workflow run "$WORKFLOW" --repo "$GITHUB_REPOSITORY" -f number="$NUMBER"
            echo "Dispatched $WORKFLOW for #$NUMBER ($AFTER)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          gh workflow run "$WORKFLOW" --repo "$GITHUB_REPOSITORY" -f number=0 -f mode=advance 2>/dev/null \
            && echo "Dispatched loop advance" | tee -a "$GITHUB_STEP_SUMMARY" || echo "Loop advance not available in this repo"
