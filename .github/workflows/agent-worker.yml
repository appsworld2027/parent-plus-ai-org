# Reusable agent worker. Called by each repo's ai-agents.yml when an ai:* stage label is added
# (or by workflow_dispatch to chain agent -> agent). The router decides: skip, pause (no
# engine connected) or run the chosen engine (Claude Code, Codex, or the free engine = Claude Code
# through Free Claude Code on free NVIDIA NIM models) as the named agent.
name: Agent worker

on:
  workflow_call:
    inputs:
      number:
        description: Issue or PR number
        required: true
        type: string
      handbook_ref:
        description: Branch/tag of the AI Org handbook to use
        required: false
        type: string
        default: main
      dispatch_workflow:
        description: Caller workflow file to re-dispatch when the stage label changes
        required: false
        type: string
        default: ai-agents.yml
    secrets:
      AI_ORG_HANDBOOK_SSH_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      CODEX_AUTH_JSON:
        required: false
      NVIDIA_NIM_API_KEY:
        required: false

jobs:
  agent:
    # Master off switch (founder decision 2026-11-26). Runs only if the CALLING repo sets the Actions
    # variable UNATTENDED_AGENTS=on. Unset or anything else = no unattended agent runs. See AGENTS.md section 2.
    if: vars.UNATTENDED_AGENTS == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 95
    concurrency:
      group: ai-agent-${{ github.repository }}-${{ inputs.number }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      NUMBER: ${{ inputs.number }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check handbook access
        if: github.repository != 'appsworld2027/parent-plus-ai-org'
        env:
          HANDBOOK_ACCESS: ${{ secrets.AI_ORG_HANDBOOK_SSH_KEY != '' }}
        run: |
          if [ "$HANDBOOK_ACCESS" != true ]; then
            echo "::error::Private AI Org handbook access requires AI_ORG_HANDBOOK_SSH_KEY (read-only deploy key for the AI Org repository)."
            exit 1
          fi
      - name: Load AI Org handbook
        uses: actions/checkout@v5
        with:
          repository: appsworld2027/parent-plus-ai-org
          ref: ${{ inputs.handbook_ref }}
          path: .ai-org-handbook
          token: ${{ github.token }}
          ssh-key: ${{ github.repository == 'appsworld2027/parent-plus-ai-org' && '' || secrets.AI_ORG_HANDBOOK_SSH_KEY }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Read item
        id: item
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER" > /tmp/item.json
          jq -r '.body // ""' /tmp/item.json > /tmp/body.md
          echo "labels=$(jq -r '[.labels[].name] | join(",")' /tmp/item.json)" >> "$GITHUB_OUTPUT"
          echo "is_pr=$(jq -r 'has("pull_request")' /tmp/item.json)" >> "$GITHUB_OUTPUT"
          echo "stage=$(jq -r '[.labels[].name | select(startswith("ai:"))] | first // ""' /tmp/item.json)" >> "$GITHUB_OUTPUT"

      - name: Route
        id: router
        env:
          LABELS: ${{ steps.item.outputs.labels }}
          IS_PR: ${{ steps.item.outputs.is_pr }}
          ENGINE_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          ENGINE_CODEX: ${{ secrets.CODEX_AUTH_JSON != '' }}
          ENGINE_FREE: ${{ secrets.NVIDIA_NIM_API_KEY != '' }}
        run: |
          set -euo pipefail
          PRFLAG=""; [ "$IS_PR" = "true" ] && PRFLAG="--pr"
          # Optional per-stage free model chosen by the product (after a model trial): .ai-org/manifest.json ai.freeModels["ai:tests"]
          STAGE=$(printf '%s' "$LABELS" | tr ',' '\n' | grep -m1 '^ai:' || true)
          SEAT=$(case "$STAGE" in ai:tests) echo author;; ai:tests-review) echo challenger;; ai:tests-signoff) echo accountable;; *) echo "";; esac)
          FREE_MODEL_OVERRIDE=$(jq -r --arg s "$STAGE" --arg seat "$SEAT" '(.raci["ai:tests"].models[$seat] // .ai.freeModels[$s]) // ""' .ai-org/manifest.json 2>/dev/null || true)
          export FREE_MODEL_OVERRIDE; [ -n "$FREE_MODEL_OVERRIDE" ] && echo "free model for $STAGE from manifest: $FREE_MODEL_OVERRIDE"
          node .ai-org-handbook/scripts/agent-router.mjs --labels "$LABELS" $PRFLAG --body-file /tmp/body.md --number "$NUMBER" --repo "$GITHUB_REPOSITORY" | tee /tmp/route.json
          {
            echo "### AI Org router — #$NUMBER"
            echo '```json'; cat /tmp/route.json; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Install the product's dependencies and test browser BEFORE the agent starts, so its time budget goes to the
      # work itself (2026-11-23: Quinn spent part of a 50-minute run discovering and installing them).
      - name: Prepare the product workspace (dependencies + test browser)
        if: steps.router.outputs.action == 'run'
        continue-on-error: true
        run: |
          set -uo pipefail
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund >/tmp/prepare.log 2>&1 && echo "npm ci: OK" || { echo "npm ci failed"; tail -20 /tmp/prepare.log; }; fi
          if [ -f package.json ] && grep -q '"@playwright/test"' package.json; then
            npx playwright install --with-deps chromium >>/tmp/prepare.log 2>&1 && echo "Playwright chromium: OK" || echo "Playwright install failed"
          fi

      # AI Org v3: no agent starts from zero. Build the onboarding pack (role + RACI seat, role lessons, product memory,
      # contract + every handover so far, why the previous attempt failed, the task) at /tmp/onboarding.md.
      - name: Onboarding pack
        if: steps.router.outputs.action == 'run'
        shell: bash --noprofile --norc {0}
        env:
          STAGE: ${{ steps.item.outputs.stage }}
          ROLE: ${{ steps.router.outputs.role }}
          SEAT: ${{ steps.router.outputs.seat }}
        run: |
          set -uo pipefail
          mkdir -p /tmp/agent-logs
          SLUG=$(grep -o 'ai/contract-[a-z0-9-]*' /tmp/body.md | head -1 | sed 's#ai/contract-##')
          [ -n "$SLUG" ] || SLUG=$(jq -r '.title' /tmp/item.json | grep -o '\[[a-z0-9-]*\]$' | tr -d '[]')
          FEATURE=""
          if [ -n "$SLUG" ] && git ls-remote --exit-code --heads origin "ai/contract-$SLUG" >/dev/null 2>&1; then
            # Read the feature branch in a separate worktree so the agent's own checkout stays clean.
            git fetch -q origin "ai/contract-$SLUG" && git worktree add -q -f --detach /tmp/feature-wt "origin/ai/contract-$SLUG" && FEATURE="/tmp/feature-wt/docs/product/$SLUG"
          fi
          # Trial controls are known-good answers for model trials; agents must never see them.
          rm -rf .ai-org-handbook/trial
          # Attempt memory: the most recent failed run on this item, summarised by the worker that failed.
          # Only failures from the last 24 hours count as "the previous attempt"; older ones are history, not guidance.
          SINCE=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments?per_page=100" --jq "[.[] | select(.created_at > \"$SINCE\") | select(.body | contains(\"ai-org:failed\"))] | last | .body // \"\"" > /tmp/attempt.md 2>/dev/null || true
          printf 'Item #%s, stage %s, seat %s. Read the item: gh issue view %s --comments\n' "$NUMBER" "$STAGE" "${SEAT:-none}" "$NUMBER" > /tmp/task.md
          node .ai-org-handbook/scripts/onboarding-pack.mjs --role "$ROLE" --stage "$STAGE" --slug "$SLUG" --seat "$SEAT" --feature "$FEATURE" \
            --attempt /tmp/attempt.md --task /tmp/task.md --out /tmp/onboarding.md
          cp /tmp/onboarding.md /tmp/agent-logs/onboarding.md
          echo "onboarding pack: $(wc -c < /tmp/onboarding.md) characters for $ROLE ($STAGE, seat ${SEAT:-none}, feature ${SLUG:-none})"
          echo "slug=$SLUG" >> "$GITHUB_ENV"
          echo "contract_before=$(git rev-parse -q --verify "origin/ai/contract-$SLUG" 2>/dev/null || true)" >> "$GITHUB_ENV"

      - name: Pause (no engine connected)
        if: steps.router.outputs.action == 'pause'
        env:
          PAUSE_COMMENT: ${{ steps.router.outputs.pause_comment }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" --paginate --jq '.[].body' | grep -q 'ai-org:paused'; then
            echo "Pause comment already present - not posting again."
          else
            printf '%s\n' "$PAUSE_COMMENT" > /tmp/pause.md
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/pause.md
          fi

      - name: Run agent with Claude Code
        if: steps.router.outputs.action == 'run' && steps.router.outputs.engine == 'claude'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.router.outputs.prompt }}
          claude_args: --allowedTools "Bash,Read,Edit,Write,Glob,Grep,WebSearch,WebFetch"

      - name: Run agent with the free engine (Claude Code via FCC + NVIDIA NIM)
        if: steps.router.outputs.action == 'run' && steps.router.outputs.engine == 'free'
        env:
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          FREE_MODEL: ${{ steps.router.outputs.free_model }}
          PROMPT: ${{ steps.router.outputs.prompt }}
          AGENT_NAME: ${{ steps.router.outputs.agent_name }}
        run: |
          set -uo pipefail
          mkdir -p /tmp/agent-logs
          curl -LsSf https://astral.sh/uv/install.sh | sh >/dev/null
          export PATH="$HOME/.local/bin:$PATH"
          uv tool install free-claude-code >/dev/null
          npm install -g @anthropic-ai/claude-code >/dev/null
          mkdir -p "$HOME/.fcc" "$HOME/.claude"
          # FREE_MODEL may carry a reasoning effort chosen by a model trial: "nvidia_nim/<model>@low" (FCC REASONING_POLICY).
          EFFORT=""; case "$FREE_MODEL" in *@*) EFFORT="${FREE_MODEL##*@}"; FREE_MODEL="${FREE_MODEL%@*}";; esac
          printf 'NVIDIA_NIM_API_KEY=%s\nMODEL=%s\nHTTP_READ_TIMEOUT=600\nFCC_OPEN_BROWSER=false\n' "$NVIDIA_NIM_API_KEY" "$FREE_MODEL" > "$HOME/.fcc/.env"
          [ -n "$EFFORT" ] && printf 'REASONING_POLICY=%s\n' "$EFFORT" >> "$HOME/.fcc/.env" && echo "reasoning effort: $EFFORT"
          chmod 600 "$HOME/.fcc/.env"
          echo '{"includeCoAuthoredBy": false}' > "$HOME/.claude/settings.json"
          nohup fcc-server > /tmp/agent-logs/fcc.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8082/v1/models && break; sleep 1; done
          git config user.name "$AGENT_NAME (AppsWorld AI Org)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          PROMPT="$PROMPT
          7. Engine facts: you are running on the model $FREE_MODEL, served free by NVIDIA NIM through Free Claude Code. You are not a Claude model. Whenever you name the model or engine that did the work (comments, commits, PRs), state exactly this.
          8. Post every comment and PR body with --body-file pointing to a file you wrote first (never inline --body), so code formatting survives.
          9. Evidence rule: every claim that checks passed must link a CI run or quote the command and its result line."
          if [ -f .ai-org/manifest.json ] && jq -e '.governance.autoMerge == false' .ai-org/manifest.json >/dev/null; then
            PROMPT="$PROMPT
          10. This repository forbids agents from merging. Never run gh pr merge or enable auto-merge here; open the PR and stop."
          fi
          [ -d node_modules ] && PROMPT="$PROMPT
          11. Dependencies (node_modules) and the Playwright Chromium browser are already installed. Do not reinstall them and do not read dependency source code."
          start=$(date +%s)
          ANTHROPIC_BASE_URL=http://127.0.0.1:8082 ANTHROPIC_AUTH_TOKEN=freecc API_TIMEOUT_MS=600000 DISABLE_AUTOUPDATER=1 \
            timeout 3600 claude -p "$PROMPT" --allowedTools "Bash,Read,Edit,Write,Glob,Grep,WebSearch,WebFetch" --max-turns 150 \
            --output-format stream-json --verbose > /tmp/agent-logs/agent.jsonl 2> /tmp/agent-logs/agent.stderr
          rc=$?
          secs=$(( $(date +%s) - start ))
          stats=$(jq -r 'select(.type=="result") | "turns=\(.num_turns) subtype=\(.subtype) is_error=\(.is_error)"' /tmp/agent-logs/agent.jsonl 2>/dev/null | tail -1)
          final=$(jq -r 'select(.type=="result") | .result // ""' /tmp/agent-logs/agent.jsonl 2>/dev/null | tail -c 3000)
          {
            echo "### Free engine run — $AGENT_NAME on \`$FREE_MODEL\` — exit $rc in ${secs}s — ${stats:-no result event}"
            echo '```'; printf '%s\n' "${final:-<no final message; see agent.jsonl / agent.stderr artifacts>}"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "AGENT_RESULT exit=$rc secs=$secs ${stats:-no-result-event}"
          printf '%s\n' "$final" | tail -c 3000
          tail -c 1500 /tmp/agent-logs/agent.stderr
          exit $rc

      - name: Run agent with Codex (experimental until verified with a ChatGPT subscription)
        # Second switch: Codex stays off until a sandboxed run is verified in CI (set UNATTENDED_CODEX=on to try it).
        if: steps.router.outputs.action == 'run' && steps.router.outputs.engine == 'codex' && vars.UNATTENDED_CODEX == 'on'
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          PROMPT: ${{ steps.router.outputs.prompt }}
        run: |
          set -euo pipefail
          npm install -g @openai/codex >/dev/null
          export CODEX_HOME="$RUNNER_TEMP/codex-home"; mkdir -p "$CODEX_HOME"
          printf '%s' "$CODEX_AUTH_JSON" > "$CODEX_HOME/auth.json"; chmod 600 "$CODEX_HOME/auth.json"
          # Sandboxed: writes limited to the workspace; network on so gh/git work. Never the bypass flag.
          codex exec --sandbox workspace-write -c sandbox_workspace_write.network_access=true "$PROMPT"
          echo "::warning::Codex may have refreshed its login. Saving it back to the CODEX_AUTH_JSON secret needs a bot token (SECURITY_DEBT S7)."

      - name: Export NVIDIA worker usage
        if: always() && steps.router.outputs.action == 'run' && steps.router.outputs.engine == 'free'
        run: |
          if [ -f /tmp/agent-logs/agent.jsonl ]; then
            node "$GITHUB_WORKSPACE/.ai-org-handbook/scripts/worker-usage.mjs" /tmp/agent-logs/agent.jsonl /tmp/route.json /tmp/ai-org-usage.json
          fi

      - name: Publish worker usage
        if: always() && steps.router.outputs.action == 'run' && steps.router.outputs.engine == 'free'
        uses: actions/upload-artifact@v4
        with:
          name: ai-org-usage-${{ github.run_attempt }}
          path: /tmp/ai-org-usage.json
          if-no-files-found: ignore

      # Independent check of Quinn's locked tests: they must be red for the right reason (scripts/grade-acceptance.mjs).
      # The loop only opens the build when this commit status is green, so broken tests never reach Dev.
      - name: Acceptance-test gate (ai:tests only)
        if: always() && steps.router.outputs.action == 'run' && steps.router.outputs.stage == 'ai:tests'
        shell: bash --noprofile --norc {0}
        run: |
          set -uo pipefail
          PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --search "Closes #$NUMBER in:body" --json number,headRefName,headRefOid -q '.[0] // empty')
          [ -n "$PR" ] || { echo "No open contract PR for #$NUMBER yet - nothing to grade"; exit 0; }
          PRN=$(jq -r .number <<<"$PR"); BR=$(jq -r .headRefName <<<"$PR"); SHA=$(jq -r .headRefOid <<<"$PR")
          git fetch -q origin "$BR" main && git checkout -q -f --detach "$SHA" && git clean -qfd -e node_modules
          LOCKED=$(jq -r '.loop.lockedPaths // "e2e/acceptance/"' .ai-org/manifest.json); SLUG=${BR#ai/contract-}
          SPEC=$(git diff --name-only origin/main...HEAD -- "$LOCKED" | grep -E '\.(spec|test)\.[cm]?[jt]sx?$' | head -1)
          if [ -z "$SPEC" ]; then printf '### Acceptance-test gate: FAIL\n\nNo new locked spec in %s on %s.\n' "$LOCKED" "$BR" > /tmp/gate.md; g=1
          else
            npx tsc --noEmit >/tmp/agent-logs/gate-tsc.txt 2>&1; tsc=$?
            npx playwright test "$SPEC" --reporter=json --timeout=20000 --workers=2 > /tmp/agent-logs/gate-report.json 2>/tmp/agent-logs/gate-pw.txt || true
            node .ai-org-handbook/scripts/grade-acceptance.mjs --spec "$SPEC" --report /tmp/agent-logs/gate-report.json \
              --contract "docs/product/$SLUG/ACCEPTANCE.md" --src src --tsc-exit "$tsc" --md /tmp/gate.md >/dev/null; g=$?
          fi
          cat /tmp/gate.md | tee -a "$GITHUB_STEP_SUMMARY"
          { echo "<!-- ai-org:gate $SHA -->"; echo "**[Acceptance-test gate — automatic, not an agent]** on \`${SHA:0:7}\`"; echo; cat /tmp/gate.md; } > /tmp/gate-comment.md
          gh pr comment "$PRN" --repo "$GITHUB_REPOSITORY" --body-file /tmp/gate-comment.md >/dev/null
          STATE=$([ "$g" = 0 ] && echo success || echo failure)
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$STATE" -f context=acceptance-gate \
            -f description="$(head -1 /tmp/gate.md | sed 's/^### //' | cut -c1-130)" >/dev/null
          echo "acceptance-gate = $STATE on ${SHA:0:7}"

      # AI Org v3: the run is only complete with a valid handover packet committed for the next role.
      - name: Handover check
        env:
          STAGE: ${{ steps.item.outputs.stage }}
        # Pilot scope: the QA chain stages (they all commit to the contract branch). Other stages read packs but are not yet gated.
        if: steps.router.outputs.action == 'run' && startsWith(steps.router.outputs.stage, 'ai:tests')
        shell: bash --noprofile --norc {0}
        run: |
          set -uo pipefail
          [ -n "${slug:-}" ] || { echo "no feature slug - handover check skipped"; exit 0; }
          git fetch -q origin "ai/contract-$slug" 2>/dev/null || { echo "no contract branch - handover check skipped"; exit 0; }
          FROM=${contract_before:-$GITHUB_SHA}
          NEW=$(git diff --name-only --diff-filter=A "$FROM" "origin/ai/contract-$slug" -- "docs/product/$slug/handoffs/" 2>/dev/null | sort | tail -1)
          ok=1
          if [ -z "$NEW" ]; then echo "::error::No handover packet was committed to docs/product/$slug/handoffs/ by this run"; ok=0
          else
            git show "origin/ai/contract-$slug:$NEW" > /tmp/handoff.md
            node .ai-org-handbook/scripts/handoff.mjs validate /tmp/handoff.md | tee -a "$GITHUB_STEP_SUMMARY" /tmp/agent-logs/handover.txt; [ "${PIPESTATUS[0]}" = 0 ] || ok=0
          fi
          if [ "$ok" = 1 ]; then
            # The stage is done: clear its label even if the agent forgot, so the loop can move on.
            gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$STAGE" >/dev/null 2>&1 || true
          else
            # Context would be lost: stop the chain instead of handing over blind.
            gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --add-label ai:blocked >/dev/null 2>&1 || true
            exit 1
          fi

      - name: Save agent logs
        if: always() && steps.router.outputs.action == 'run'
        uses: actions/upload-artifact@v4
        with:
          name: agent-logs-${{ inputs.number }}-${{ github.run_attempt }}
          path: /tmp/agent-logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Report a failed run (not retried automatically)
        if: failure() && steps.router.outputs.action == 'run'
        env:
          AGENT_NAME: ${{ steps.router.outputs.agent_name }}
          AGENT_ROLE: ${{ steps.router.outputs.agent_role }}
          ENGINE: ${{ steps.router.outputs.engine }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            printf '%s\n' "<!-- ai-org:failed -->" "**[$AGENT_NAME — $AGENT_ROLE] Run failed** on the \`$ENGINE\` engine. Logs: $RUN_URL (artifact \`agent-logs-$NUMBER-${{ github.run_attempt }}\`)." ""
            echo "**What the next attempt must know (attempt memory):**"; echo '```'
            grep -h "AGENT_RESULT\|handover INVALID\|^- " /tmp/agent-logs/*.txt 2>/dev/null | head -10
            jq -r 'select(.type=="assistant") | .message.content[]? | select(.type=="text") | .text' /tmp/agent-logs/agent.jsonl 2>/dev/null | tail -c 1200
            echo '```'; echo; echo "Not retried automatically: Kiran or Arjun decides the retry; the next run reads this note first."
          } > /tmp/failed.md
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/failed.md

      - name: Chain to the next agent if the stage changed
        if: steps.router.outputs.action == 'run'
        env:
          BEFORE: ${{ steps.item.outputs.stage }}
          WORKFLOW: ${{ inputs.dispatch_workflow }}
        run: |
          set -euo pipefail
          AFTER=$(gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER" --jq '[.labels[].name | select(startswith("ai:"))] | first // ""')
          echo "stage before: ${BEFORE:-none}  after: ${AFTER:-none}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -n "$AFTER" ] && [ "$AFTER" != "$BEFORE" ]; then
            gh workflow run "$WORKFLOW" --repo "$GITHUB_REPOSITORY" -f number="$NUMBER"
            echo "Dispatched $WORKFLOW for #$NUMBER ($AFTER)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          # Agent pushes made with the workflow token do not trigger CI. Let the loop controller
          # dispatch CI, run contract-lock and move the outer loop (it ignores unknown modes safely).
          gh workflow run "$WORKFLOW" --repo "$GITHUB_REPOSITORY" -f number=0 -f mode=advance 2>/dev/null \
            && echo "Dispatched loop advance" | tee -a "$GITHUB_STEP_SUMMARY" || echo "Loop advance not available in this repo"
