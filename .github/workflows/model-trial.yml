# Temporary owner-only isolated native model artifact proof. NEVER merge.
name: Frontier Tara NIM synthetic evaluation (temporary)
on:
  pull_request:
    types: [opened, synchronize]
    branches: ['ai/frontier-database-evaluator-20261127']
    paths: ['.github/workflows/model-trial.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: frontier-tara-nim-proof
  cancel-in-progress: false
env:
  FRONTIER_SOURCE_SHA: 2f29db417e2570fa024271be7ec391d1bf82f46a
  FRONTIER_SEED: synthetic-tara-proof-20261127
  FRONTIER_POSTGRES_IMAGE: postgres@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
jobs:
  generate:
    if: >-
      github.repository == 'appsworld2027/parent-plus-ai-org' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'review/frontier-tara-nim-20261127' &&
      github.event.pull_request.base.ref == 'ai/frontier-database-evaluator-20261127' &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.draft == true
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        variant: [normal]
    env:
      FRONTIER_VARIANT: ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 2f29db417e2570fa024271be7ec391d1bf82f46a
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Execute bounded native free Tara model fixture
        env:
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          OUTPUT_DIR: ${{ runner.temp }}/frontier-tara-generate
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$FRONTIER_SOURCE_SHA" ]
          node --input-type=module <<'NODE'
          import {mkdirSync,readFileSync,writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          import {createHash} from 'node:crypto';
          import {prepareFrontierCasebook,intakeFrontierArtifact} from './scripts/frontier-casebook.mjs';
          import {rubric,canonicalHash} from './scripts/frontier-admission.mjs';
          const sha=x=>createHash('sha256').update(x).digest('hex');
          const sourceSha=process.env.FRONTIER_SOURCE_SHA,seed=process.env.FRONTIER_SEED,dir=process.env.OUTPUT_DIR;
          mkdirSync(dir,{recursive:true});
          const roleDefinitions=Object.fromEntries(rubric.roles.map(({role})=>[role,readFileSync('org/agents/'+role+'.md','utf8')]));
          const book=prepareFrontierCasebook({sourceSha,seed,roleDefinitions});
          const c=book.cases.find(x=>x.fixture.role==='tara-database'&&x.fixture.variant===process.env.FRONTIER_VARIANT);
          const model='nvidia/nemotron-3-ultra-550b-a55b',key=process.env.NVIDIA_NIM_API_KEY;
          const supplement=readFileSync("governance/FRONTIER_DATABASE_BEHAVIOR.md","utf8").split("## Candidate interface")[1].split("## Evidence")[0];
          const attempt={schema:1,supplementHash:sha(supplement),sourceSha,planHash:book.planHash,fixtureHash:c.fixtureHash,promptHash:c.promptHash,
            role:'tara-database',variant:process.env.FRONTIER_VARIANT,provider:'nvidia',requestedModel:model,route:'native-readonly-artifact-response',
            runId:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,
            scope:'isolated-synthetic',qualification:false,toolExecution:false,productionReady:false};
          const save=()=>writeFileSync(join(dir,'attempt.json'),JSON.stringify(attempt,null,2));
          save();
          if(!key)throw Error('Approved free-route key missing; no fallback');
          const body={model,temperature:0.2,top_p:0.95,max_tokens:10000,reasoning_effort:'medium',reasoning_budget:2048,stream:false,messages:[{role:'system',content:'You are Tara, database specialist. Produce the three required artifacts as exact JSON only, using the supplemental interface below. Keep migration SQL under 5500 chars and tests under 2600 chars. Make no unobserved claims. EXACT OUTPUT MANIFEST: {"files":[{"path":"migration.sql","content":"SQL as one JSON string"},{"path":"invariants.test.sql","content":"SQL as one JSON string"},{"path":"recovery.md","content":"Markdown as one JSON string"}]}. Replace placeholders. Each file object has ONLY path and content; no directories, alternate names, arrays, code fences, or additional keys; escape line breaks in JSON strings. Double-check all three exact filenames and nonempty string contents before returning. '+supplement},{role:'user',content:c.prompt}]};
          attempt.requestHash=canonicalHash(body);
          const t=Date.now();
          try{
            const res=await fetch('https://integrate.api.nvidia.com/v1/chat/completions',{method:'POST',headers:{Authorization:'Bearer '+key,'Content-Type':'application/json'},body:JSON.stringify(body),redirect:'error',signal:AbortSignal.timeout(240000)});
            attempt.httpStatus=res.status;
            if(!res.ok){
              try{const e=(await res.json()).error||{};if(typeof e.code==='string'&&/^[a-zA-Z0-9_-]{1,64}$/.test(e.code))attempt.errorCode=e.code;}catch{}
              throw Error('Provider rejected exact free model: '+res.status);
            }
            const j=await res.json();attempt.observedModel=j.model;attempt.finishReason=j.choices?.[0]?.finish_reason;
            attempt.usage={prompt:j.usage?.prompt_tokens??null,completion:j.usage?.completion_tokens??null,total:j.usage?.total_tokens??null};
            if(j.model!==model||j.choices?.length!==1||attempt.finishReason!=='stop')throw Error('Incomplete or wrong observed model');
            const raw=j.choices[0].message?.content;
            if(typeof raw!=='string'||raw.length>50000||raw.includes(key))throw Error('Invalid model response');
            attempt.responseHash=sha(raw);
            const parsed=JSON.parse(raw.trim().replace(/^\x60\x60\x60(?:json)?\s*([\s\S]*?)\s*\x60\x60\x60$/i,'$1'));
            writeFileSync(join(dir,'raw-response.json'),JSON.stringify({responseHash:attempt.responseHash,raw},null,2));
            attempt.manifestDiagnostic={keys:parsed&&typeof parsed==='object'?Object.keys(parsed).length:null,files:Array.isArray(parsed?.files)?parsed.files.slice(0,6).map(f=>({pathKnown:c.fixture.requiredFiles.includes(f?.path),pathHash:typeof f?.path==='string'?sha(f.path):null,properties:f&&typeof f==='object'?Object.keys(f).length:null,contentType:typeof f?.content,contentBytes:typeof f?.content==='string'?Buffer.byteLength(f.content):null})):null};
            console.log(JSON.stringify({manifestDiagnostic:attempt.manifestDiagnostic}));
            const intake=intakeFrontierArtifact(c.fixture,parsed);
            attempt.artifactHash=intake.artifactHash;attempt.status='artifact-intake-only';
            writeFileSync(join(dir,'candidate.json'),JSON.stringify({files:intake.files},null,2));
            writeFileSync(join(dir,'plan.json'),JSON.stringify(book.payload,null,2));
            console.log(JSON.stringify({role:attempt.role,variant:attempt.variant,model:attempt.observedModel,artifactHash:attempt.artifactHash,usage:attempt.usage,qualification:false}));
          }catch(e){attempt.status='failed-no-fallback';throw e;}
          finally{attempt.durationMs=Date.now()-t;save();console.log(JSON.stringify({observedModel:attempt.observedModel,finishReason:attempt.finishReason,usage:attempt.usage,status:attempt.status,httpStatus:attempt.httpStatus}));}
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontier-tara-candidate-${{ matrix.variant }}
          path: ${{ runner.temp }}/frontier-tara-generate/
          if-no-files-found: error
          retention-days: 14
  independent-evaluation:
    needs: generate
    if: needs.generate.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        variant: [normal]
    env:
      FRONTIER_VARIANT: ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 2f29db417e2570fa024271be7ec391d1bf82f46a
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: frontier-tara-candidate-${{ matrix.variant }}
          path: ${{ runner.temp }}/frontier-tara-candidate
      - name: Verify exact migration artifact and execute 14 independent locked DB checks
        env:
          INPUT_DIR: ${{ runner.temp }}/frontier-tara-candidate
          OUTPUT_DIR: ${{ runner.temp }}/frontier-tara-eval
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$FRONTIER_SOURCE_SHA" ]
          docker pull "$FRONTIER_POSTGRES_IMAGE"
          node --input-type=module <<'NODE'
          import {readFileSync,mkdirSync,writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          import {prepareFrontierCasebook,intakeFrontierArtifact} from './scripts/frontier-casebook.mjs';
          import {rubric,canonicalHash} from './scripts/frontier-admission.mjs';
          import {evaluateDatabaseMigration} from './scripts/frontier-database-evaluator.mjs';
          import {createHash} from 'node:crypto';
          const src=process.env.FRONTIER_SOURCE_SHA,dir=process.env.INPUT_DIR,out=process.env.OUTPUT_DIR;
          const read=name=>JSON.parse(readFileSync(join(dir,name),'utf8'));
          const a=read('attempt.json'),plan=read('plan.json'),raw=read('candidate.json');
          const roleDefinitions=Object.fromEntries(rubric.roles.map(({role})=>[role,readFileSync('org/agents/'+role+'.md','utf8')]));
          const book=prepareFrontierCasebook({sourceSha:src,seed:process.env.FRONTIER_SEED,roleDefinitions});
          const c=book.cases.find(x=>x.fixture.role==='tara-database'&&x.fixture.variant===process.env.FRONTIER_VARIANT);
          const intake=intakeFrontierArtifact(c.fixture,raw);
          const supplement=readFileSync('governance/FRONTIER_DATABASE_BEHAVIOR.md','utf8').split('## Candidate interface')[1].split('## Evidence')[0];
          const supplementHash=createHash('sha256').update(supplement).digest('hex');
          if(a.supplementHash!==supplementHash||a.sourceSha!==src||a.planHash!==book.planHash||canonicalHash(plan)!==book.planHash||
            a.fixtureHash!==c.fixtureHash||a.promptHash!==c.promptHash||a.artifactHash!==intake.artifactHash||
            a.provider!=='nvidia'||a.requestedModel!=='nvidia/nemotron-3-ultra-550b-a55b'||a.observedModel!=='nvidia/nemotron-3-ultra-550b-a55b'||a.httpStatus!==200||a.finishReason!=='stop'||a.runId!==process.env.GITHUB_RUN_ID||a.attempt!==process.env.GITHUB_RUN_ATTEMPT||
            a.status!=='artifact-intake-only')throw Error('Candidate provenance mismatch');
          const result=await evaluateDatabaseMigration(intake.files.find(f=>f.path==='migration.sql').content,{image:process.env.FRONTIER_POSTGRES_IMAGE});
          const evidence={schema:1,runId:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,sourceSha:src,planHash:book.planHash,fixtureHash:c.fixtureHash,artifactHash:intake.artifactHash,executionAttemptHash:canonicalHash(a),result,qualification:false,productionReady:false};
          mkdirSync(out,{recursive:true});writeFileSync(join(out,'behavior.json'),JSON.stringify(evidence,null,2));
          console.log(JSON.stringify({role:'tara-database',variant:process.env.FRONTIER_VARIANT,artifactHash:intake.artifactHash,status:result.qualified?'database-screen-pass':'database-screen-fail',passed:result.passed,expected:result.expected,deployed:false,qualification:false}));
          if(!result.qualified)process.exitCode=1;
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontier-tara-independent-behavior-${{ matrix.variant }}
          path: ${{ runner.temp }}/frontier-tara-eval/
          if-no-files-found: warn
          retention-days: 14
