          console.log(JSON.stringify(results,null,2));if(results.some(r=>r.status!=='ARTIFACT_PRODUCED'))process.exitCode=1;
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: course-role-deliverables-${{ matrix.lane }}
          path: ${{ runner.temp }}/role-deliverables/
          retention-days: 14

