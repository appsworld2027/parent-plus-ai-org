          const context={source:manifest.source,contract,role,fixturePublicAPI:fixture,fixtureImport:"import { backend, login } from '../support/backend';",testRunner:"Playwright TypeScript. backend(page,{academy:true}) installs fictional transport, then login(page) navigates and authenticates. Course feature is absent from this baseline. Each positive acceptance case must start by waiting on the new accessible Courses button. No runtime changes."};
          writeFileSync(process.env.RUNNER_TEMP+'/course-author/input.json',JSON.stringify(context));
