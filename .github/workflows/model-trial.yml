          const j=await res.json();if(j.model!==model)throw Error('Model identity mismatch');
          const review=j.choices?.[0]?.message?.content?.trim();if(typeof review!=='string'||review.length<600||review.length>16000)throw Error('Incomplete review artifact');
          writeFileSync(d+'/review.md',review+'\n'); for(const line of review.split(/\r?\n/))console.log('REVIEW | '+line); console.log(JSON.stringify({model:j.model,finish:j.choices?.[0]?.finish_reason,usage:j.usage??null}));
          const ids=Array.from({length:6},(_,i)=>'CRS-01-SC-00'+(i+1));
          if(ids.some(id=>!review.includes(id)))throw Error('Incomplete six-AC review');
          const verdict=review.match(/VERDICT: (APPROVE|CHANGES)$/)?.[1];if(!verdict)throw Error('No final exact verdict');
          const receipt={schema:'course-quinn-challenger/v1',stage:'ai:tests-review',role:'quinn-qa',seat:'challenger',source:input.source,contractHash:input.contractHash,testHash:input.testHash,supportHash:input.supportHash,authorArtifactSha256:input.authorArtifactSha256,model,reasoning:'medium',contextSha256:sha(prompt+'\n'+raw),artifactSha256:sha(review+'\n'),verdict,passed:verdict==='APPROVE',mutationExecution:false,redExecution:false,usage:j.usage??null,ms:Date.now()-t};
          writeFileSync(d+'/review.md',review+'\n');writeFileSync(d+'/review.json',JSON.stringify(receipt,null,2));
          console.log(JSON.stringify(receipt,null,2));
          // The review is synthetic public source only; prefix prevents workflow-command execution.
          for(const line of review.split(/\r?\n/))console.log('REVIEW | '+line);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: course-quinn-challenger
          path: |
            ${{ runner.temp }}/challenge/review.md
            ${{ runner.temp }}/challenge/review.json
