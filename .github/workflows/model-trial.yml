            const prompt='Act independently as '+role+' under the canonical role card on this EXACT real Parent Plus Course source. Deliver a concrete implementation-ready Markdown artifact, not general advice. Use five concise headings EXACTLY: DECISION, DELIVERABLE, EVIDENCE, RISKS, HANDOFF. Name verifiable paths, invariants, inputs/outputs, testable oracles and unresolved blockers. Do not claim execution or a passed test. Do not change source, run commands or reveal keys. Use only supplied context. Finish within 500 words. No extended explanation. Include ALL five headings, even if a limitation must be marked unknown. The acceptance lock is NOT approved; never claim otherwise.';
            // Bound request size and aggregate free-tier scheduling; no fallback or repeated retry.
            const cap=process.env.ROLE_RETEST==='1'?2800:1800;const estimated=Math.ceil((raw.length+prompt.length)/3)+cap;
            if(estimated>8500){results.push({role,status:'BLOCKED_CONTEXT',estimated});continue}
            const elapsed=Date.now()-windowStart;
            if(results.length&&elapsed<70000){console.log('Conservative 70-second quota pacing between independent roles');await new Promise(r=>setTimeout(r,70000-elapsed));windowStart=Date.now();windowTokens=0;}
            else if(elapsed>=61000){windowStart=Date.now();windowTokens=0;}
            try{
