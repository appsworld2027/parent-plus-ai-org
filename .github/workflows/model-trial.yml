# Temporary owner-only isolated native model artifact proof. NEVER merge.
name: Frontier Dev actual artifact proof (temporary)
on:
  pull_request:
    types: [opened, synchronize]
    branches: ['feat/frontier-trusted-receipts-20261127']
    paths: ['.github/workflows/model-trial.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: frontier-dev-native-proof
  cancel-in-progress: false
env:
  FRONTIER_SOURCE_SHA: 2d1a0248cd3f5c4f6491f7868c662ce37f1c4c70
  FRONTIER_SEED: synthetic-dev-proof-20261127
  FRONTIER_NODE_IMAGE: node@sha256:1314fb30ec37592d5845e5a160d522c0e680972aa534549940b8d73bde88481a
jobs:
  generate:
    if: >-
      github.repository == 'appsworld2027/parent-plus-ai-org' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'review/frontier-dev-artifact-20261127' &&
      github.event.pull_request.base.ref == 'feat/frontier-trusted-receipts-20261127' &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 2d1a0248cd3f5c4f6491f7868c662ce37f1c4c70
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: frontier-dev-candidate
          path: ${{ runner.temp }}/frontier-dev-prior
          run-id: 46044273665
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Classify prior failed attempt before an explicitly bounded retry
        env:
          PRIOR_DIR: ${{ runner.temp }}/frontier-dev-prior
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const a=JSON.parse(readFileSync(process.env.PRIOR_DIR+'/attempt.json','utf8'));
          console.log(JSON.stringify({previousRun:a.runId,observedModel:a.observedModel,finishReason:a.finishReason,usage:a.usage,status:a.status,httpStatus:a.httpStatus}));
          if(a.runId!=='46044273665'||a.observedModel!=='qwen/qwen3.8-27b'||a.finishReason!=='length'||a.status!=='failed-no-fallback')throw Error('Prior failure was not verified output-length exhaustion; do not retry');
          NODE
      - name: Execute bounded native free Dev model fixture
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OUTPUT_DIR: ${{ runner.temp }}/frontier-dev-generate
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$FRONTIER_SOURCE_SHA" ]
          node --input-type=module <<'NODE'
          import {mkdirSync,readFileSync,writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          import {createHash} from 'node:crypto';
          import {prepareFrontierCasebook,intakeFrontierArtifact} from './scripts/frontier-casebook.mjs';
          import {rubric,canonicalHash} from './scripts/frontier-admission.mjs';
          const sha=x=>createHash('sha256').update(x).digest('hex');
          const sourceSha=process.env.FRONTIER_SOURCE_SHA,seed=process.env.FRONTIER_SEED,dir=process.env.OUTPUT_DIR;
          mkdirSync(dir,{recursive:true});
          const roleDefinitions=Object.fromEntries(rubric.roles.map(({role})=>[role,readFileSync('org/agents/'+role+'.md','utf8')]));
          const book=prepareFrontierCasebook({sourceSha,seed,roleDefinitions});
          const c=book.cases.find(x=>x.fixture.role==='dev-coder'&&x.fixture.variant==='normal');
          const model='qwen/qwen3.8-27b',key=process.env.GROQ_API_KEY;
          const attempt={schema:1,sourceSha,planHash:book.planHash,fixtureHash:c.fixtureHash,promptHash:c.promptHash,
            role:'dev-coder',variant:'normal',provider:'groq',requestedModel:model,route:'native-readonly-artifact-response',
            runId:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,
            scope:'isolated-synthetic',qualification:false,toolExecution:false,productionReady:false};
          const save=()=>writeFileSync(join(dir,'attempt.json'),JSON.stringify(attempt,null,2));
          save();
          if(!key)throw Error('Approved free-route key missing; no fallback');
          const body={model,temperature:0,max_completion_tokens:3900,messages:[{role:'system',content:'You are an isolated coding specialist. Only produce the exact requested artifact JSON. Write compact complete runnable ESM and Node tests. Limit board.mjs to 2600 characters and board.test.mjs to 1800 characters; no explanations or large examples. Never claim execution or external access.'},{role:'user',content:c.prompt}]};
          attempt.requestHash=canonicalHash(body);
          const t=Date.now();
          try{
            const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{Authorization:'Bearer '+key,'Content-Type':'application/json'},body:JSON.stringify(body),redirect:'error',signal:AbortSignal.timeout(120000)});
            attempt.httpStatus=res.status;
            if(!res.ok){
              try{const e=(await res.json()).error||{};if(typeof e.code==='string'&&/^[a-zA-Z0-9_-]{1,64}$/.test(e.code))attempt.errorCode=e.code;}catch{}
              throw Error('Provider rejected exact free model: '+res.status);
            }
            const j=await res.json();attempt.observedModel=j.model;attempt.finishReason=j.choices?.[0]?.finish_reason;
            attempt.usage={prompt:j.usage?.prompt_tokens??null,completion:j.usage?.completion_tokens??null,total:j.usage?.total_tokens??null};
            if(j.model!==model||j.choices?.length!==1||attempt.finishReason!=='stop')throw Error('Incomplete or wrong observed model');
            const raw=j.choices[0].message?.content;
            if(typeof raw!=='string'||raw.length>50000||raw.includes(key))throw Error('Invalid model response');
            attempt.responseHash=sha(raw);
            const parsed=JSON.parse(raw.trim().replace(/^\x60\x60\x60(?:json)?\s*([\s\S]*?)\s*\x60\x60\x60$/i,'$1'));
            const intake=intakeFrontierArtifact(c.fixture,parsed);
            attempt.artifactHash=intake.artifactHash;attempt.status='artifact-intake-only';
            writeFileSync(join(dir,'candidate.json'),JSON.stringify({files:intake.files},null,2));
            writeFileSync(join(dir,'plan.json'),JSON.stringify(book.payload,null,2));
            console.log(JSON.stringify({role:attempt.role,variant:attempt.variant,model:attempt.observedModel,artifactHash:attempt.artifactHash,usage:attempt.usage,qualification:false}));
          }catch(e){attempt.status='failed-no-fallback';throw e;}
          finally{attempt.durationMs=Date.now()-t;save();console.log(JSON.stringify({observedModel:attempt.observedModel,finishReason:attempt.finishReason,usage:attempt.usage,status:attempt.status,httpStatus:attempt.httpStatus}));}
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontier-dev-candidate
          path: ${{ runner.temp }}/frontier-dev-generate/
          if-no-files-found: error
          retention-days: 14
  independent-evaluation:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 2d1a0248cd3f5c4f6491f7868c662ce37f1c4c70
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: frontier-dev-candidate
          path: ${{ runner.temp }}/frontier-dev-candidate
      - name: Verify candidate bytes and execute locked 12-test behavior independently
        env:
          INPUT_DIR: ${{ runner.temp }}/frontier-dev-candidate
          OUTPUT_DIR: ${{ runner.temp }}/frontier-dev-eval
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$FRONTIER_SOURCE_SHA" ]
          docker pull "$FRONTIER_NODE_IMAGE"
          node --input-type=module <<'NODE'
          import {readFileSync,mkdirSync,writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          import {prepareFrontierCasebook,intakeFrontierArtifact} from './scripts/frontier-casebook.mjs';
          import {rubric,canonicalHash} from './scripts/frontier-admission.mjs';
          import {evaluateBoardCode} from './scripts/frontier-board-evaluator.mjs';
          const src=process.env.FRONTIER_SOURCE_SHA,dir=process.env.INPUT_DIR,out=process.env.OUTPUT_DIR;
          const read=name=>JSON.parse(readFileSync(join(dir,name),'utf8'));
          const a=read('attempt.json'),plan=read('plan.json'),raw=read('candidate.json');
          const roleDefinitions=Object.fromEntries(rubric.roles.map(({role})=>[role,readFileSync('org/agents/'+role+'.md','utf8')]));
          const book=prepareFrontierCasebook({sourceSha:src,seed:process.env.FRONTIER_SEED,roleDefinitions});
          const c=book.cases.find(x=>x.fixture.role==='dev-coder'&&x.fixture.variant==='normal');
          const intake=intakeFrontierArtifact(c.fixture,raw);
          if(a.sourceSha!==src||a.planHash!==book.planHash||canonicalHash(plan)!==book.planHash||
            a.fixtureHash!==c.fixtureHash||a.promptHash!==c.promptHash||a.artifactHash!==intake.artifactHash||
            a.observedModel!=='qwen/qwen3.8-27b'||a.runId!==process.env.GITHUB_RUN_ID||a.attempt!==process.env.GITHUB_RUN_ATTEMPT||
            a.status!=='artifact-intake-only')throw Error('Candidate provenance mismatch');
          const result=await evaluateBoardCode(intake.files.find(f=>f.path==='board.mjs').content,{image:process.env.FRONTIER_NODE_IMAGE});
          const evidence={schema:1,runId:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,sourceSha:src,planHash:book.planHash,fixtureHash:c.fixtureHash,artifactHash:intake.artifactHash,executionAttemptHash:canonicalHash(a),result,qualification:false,productionReady:false};
          mkdirSync(out,{recursive:true});writeFileSync(join(out,'behavior.json'),JSON.stringify(evidence,null,2));
          console.log(JSON.stringify({role:'dev-coder',variant:'normal',artifactHash:intake.artifactHash,status:result.status,counts:result.counts,qualification:false}));
          if(result.status!=='behavior-pass')process.exitCode=1;
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontier-dev-independent-behavior
          path: ${{ runner.temp }}/frontier-dev-eval/
          if-no-files-found: warn
          retention-days: 14
