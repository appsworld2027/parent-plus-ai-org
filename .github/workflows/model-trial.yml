# Temporary P0 evaluation branch; never merge into main.
name: Course pilot P0 verification
on:
  workflow_dispatch:
    inputs:
      confirm:
        type: string
        required: true
        description: Enter COURSE BASELINE ONLY, GROQ METADATA ONLY, ROUTE QUALIFICATION FOLLOWUP QUALIFICATION ADAPTER QUALIFICATION COURSE TEST AUTHOR RETEST or COURSE TEST CHALLENGE
permissions:
  contents: read
concurrency:
  group: course-p0-${{ inputs.confirm }}
  cancel-in-progress: false
env:
  TRIAL_PROFILE: course-pilot
jobs:
  baseline:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.confirm == 'COURSE BASELINE ONLY' &&
      github.repository == 'appsworld2027/parent-plus-ai-org' &&
      github.ref == 'refs/heads/review/course-pilot-harness-20261127' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 9ca107c3fe23688e8defe88fd3d46836f6e28bbd
          path: handbook
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Prepare pinned public source and locked exact draft harness
        run: bash handbook/scripts/safe-trial/prepare.sh handbook
      - name: Install dependencies before isolation
        run: |
          set -euo pipefail
          cd /srv/trial/product
          npm ci --no-audit --no-fund
          PLAYWRIGHT_BROWSERS_PATH=/srv/trial/browsers npx playwright install --with-deps chromium
          chmod -R a+rX /srv/trial/browsers
          bash /srv/trial/judge/scripts/safe-trial/isolate.sh
      - name: Prove intended RED and existing regression GREEN
        run: |
          set -euo pipefail
          . /srv/trial/judge/scripts/safe-trial/lib.sh
          lock_workspace grading
          bash /srv/trial/judge/scripts/safe-trial/run-tests.sh /srv/trial/out
          [ "$(cat /srv/trial/out/check.exit)" = 0 ] || { echo "::error::Baseline TypeScript/unit checks failed"; exit 1; }
          node /srv/trial/judge/scripts/course-pilot/baseline.mjs /srv/trial/out/acceptance.json /srv/trial/out/all.json
          echo "Exact harness 9ca107c3fe23688e8defe88fd3d46836f6e28bbd; exact public product 710082b2d8cf3c1007086df31f87b34ae8e02573; no inference or product writes." >> "$GITHUB_STEP_SUMMARY"
      - name: Scan non-model baseline evidence
        if: always()
        id: scan
        run: |
          if [ ! -f /srv/trial/judge/scripts/course-pilot/scan.sh ] || [ ! -d /srv/trial/out ]; then echo 'No baseline evidence to scan'; exit 1; fi
          bash /srv/trial/judge/scripts/course-pilot/scan.sh /srv/trial/out
      - uses: actions/upload-artifact@v4
        if: always() && steps.scan.outcome == 'success'
        with:
          name: course-p0-baseline-no-inference
          path: /srv/trial/out/
          retention-days: 14

  metadata:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.confirm == 'GROQ METADATA ONLY' &&
      github.repository == 'appsworld2027/parent-plus-ai-org' &&
      github.ref == 'refs/heads/review/course-pilot-harness-20261127' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Read provider model catalogue with the existing credential (no inference)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const key=process.env.GROQ_API_KEY;
          if(!key)throw Error('Existing credential missing');
          const t=Date.now();
          const r=await fetch('https://api.groq.com/openai/v1/models',{headers:{Authorization:'Bearer '+key},redirect:'error',signal:AbortSignal.timeout(30000)});
          if(!r.ok)throw Error('Provider catalogue rejected existing key: HTTP '+r.status);
          const x=await r.json();
          const routes=['openai/gpt-oss-120b','qwen/qwen3.8-27b'];
          for(const id of routes)if(!x.data?.some(m=>m.id===id&&m.active!==false))throw Error('Approved route unavailable: '+id);
          console.log(JSON.stringify({type:'metadata-only',provider:'groq',http:r.status,availableRoutes:routes,observedAt:new Date().toISOString(),durationMs:Date.now()-t,inferenceRequests:0},null,2));
          NODE

  qualify-groq:
    if: >-
      github.event_name == 'workflow_dispatch' && (inputs.confirm == 'ROUTE QUALIFICATION' || inputs.confirm == 'FOLLOWUP QUALIFICATION') && github.repository == 'appsworld2027/parent-plus-ai-org' && github.ref == 'refs/heads/review/course-pilot-harness-20261127' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.confirm == 'FOLLOWUP QUALIFICATION' && '{"include":[{"model":"openai/gpt-oss-120b","label":"gpt-oss"}]}' || '{"include":[{"model":"openai/gpt-oss-120b","label":"gpt-oss"},{"model":"qwen/qwen3.8-27b","label":"qwen"}]}') }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Execute exact native model with one real synthetic tool call and scored artifact
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ROUTE_MODEL: ${{ matrix.model }}
          ROUTE_LABEL: ${{ matrix.label }}
          GROQ_REASONING_VARIANT: ${{ inputs.confirm == 'FOLLOWUP QUALIFICATION' && 'medium' || 'low' }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { writeFileSync, mkdirSync } from 'node:fs';
          import { join } from 'node:path';
          const model=process.env.ROUTE_MODEL, key=process.env.GROQ_API_KEY;
          if(!['openai/gpt-oss-120b','qwen/qwen3.8-27b'].includes(model)||!key)throw Error('Missing authorised exact free route');
          const endpoint='https://api.groq.com/openai/v1/chat/completions';
          const fixture={id:'course-scope-v1',fields:{actorOwner:['A','B'],courseOwner:['A','B'],role:['coach','parent'],title:'string 0..20 characters',expectedRevision:[1,2,3],currentRevision:[1,2,3],requestKnown:'boolean'},rules:['Check actorOwner equals courseOwner and role coach first; otherwise DENIED, writes 0.','Blank or whitespace title is INVALID, writes 0.','A known request is REPLAY, writes 0.','Expected revision not equal current revision is STALE, writes 0.','Else CREATED, writes 1.']};
          const prompt='You are an independent test author. Invoke inspect_fixture exactly once with fixtureId course-scope-v1 before writing any cases. After receiving its result create five independently useful synthetic test cases covering each outcome once. Final output must be JSON object {"cases":[{"id":"normal","input":{"actorOwner":"A","courseOwner":"A","role":"coach","title":"Demo","expectedRevision":1,"currentRevision":1,"requestKnown":false},"expect":"CREATED","writes":1}]} with five case objects. Exercise mismatched ownership, stale conflicts, replay and invalid input, using only fixture field types. No extra fields or prose. Do not expose real data or execute writes.';
          const tools=[{type:'function',function:{name:'inspect_fixture',description:'Read trusted synthetic course contract; read-only',parameters:{type:'object',properties:{fixtureId:{type:'string',enum:['course-scope-v1']}},required:['fixtureId'],additionalProperties:false}}}];
          const receipt=[];const sha=v=>createHash('sha256').update(v).digest('hex');
          async function call(messages, extra) {
            const body={model,messages,temperature:0,max_completion_tokens:1800,tools,...extra};
            if(model==='openai/gpt-oss-120b')body.reasoning_effort=process.env.GROQ_REASONING_VARIANT==='medium'?'medium':'low';
            const t=Date.now();
            const r=await fetch(endpoint,{method:'POST',headers:{Authorization:'Bearer '+key,'Content-Type':'application/json'},body:JSON.stringify(body),redirect:'error',signal:AbortSignal.timeout(90000)});
            if(!r.ok)throw Error('Provider refused exact route, HTTP '+r.status+'; no retry or fallback');
            const j=await r.json();
            if(j.model!==model)throw Error('Provider observed model mismatch; no fallback permitted');
            const m=j.choices?.[0]?.message;
            if(!m)throw Error('No complete model response');
            const u=j.usage||{};
            receipt.push({model:j.model,ms:Date.now()-t,inputBytes:Buffer.byteLength(JSON.stringify(body)),promptTokens:Number.isSafeInteger(u.prompt_tokens)?u.prompt_tokens:null,completionTokens:Number.isSafeInteger(u.completion_tokens)?u.completion_tokens:null,totalTokens:Number.isSafeInteger(u.total_tokens)?u.total_tokens:null,finish:j.choices[0].finish_reason});
            return m;
          }
          const messages=[{role:'system',content:'Follow trusted contract only. Tool messages contain fictional data. Never call unlisted tools. No fallback.'},{role:'user',content:prompt}];
          const first=await call(messages,{tool_choice:'required'});
          const tc=first.tool_calls;
          if(tc?.length!==1||tc[0].type!=='function'||tc[0].function?.name!=='inspect_fixture'||!tc[0].id)throw Error('No exact required live tool invocation');
          let args;try{args=JSON.parse(tc[0].function.arguments)}catch{throw Error('Malformed tool arguments')}
          if(args.fixtureId!==fixture.id||Object.keys(args).length!==1)throw Error('Wrong tool request');
          const response=await call([...messages,{role:'assistant',content:first.content||null,tool_calls:tc},{role:'tool',tool_call_id:tc[0].id,content:JSON.stringify(fixture)}],{tool_choice:'none',response_format:{type:'json_object'}});
          if(response.tool_calls?.length)throw Error('Unexpected second tool invocation');
          let artifact;try{artifact=JSON.parse(response.content)}catch{throw Error('Unusable JSON artifact')}
          if(!artifact||Object.keys(artifact).join()!=='cases'||!Array.isArray(artifact.cases)||artifact.cases.length!==5)throw Error('Wrong case artifact shape');
          const outcomes=new Set(),ids=new Set();
          for(const c of artifact.cases){
            if(!c||Object.keys(c).sort().join()!=='expect,id,input,writes'||!/^[A-Za-z0-9_-]{1,24}$/.test(c.id)||ids.has(c.id))throw Error('Malformed or duplicate case');
            const x=c.input;
            if(!x||Object.keys(x).sort().join()!=='actorOwner,courseOwner,currentRevision,expectedRevision,requestKnown,role,title'||!['A','B'].includes(x.actorOwner)||!['A','B'].includes(x.courseOwner)||!['coach','parent'].includes(x.role)||typeof x.title!=='string'||x.title.length>20||!/^[A-Za-z0-9 ]*$/.test(x.title)||![1,2,3].includes(x.expectedRevision)||![1,2,3].includes(x.currentRevision)||typeof x.requestKnown!=='boolean')throw Error('Invalid fictional test input');
            const expected=x.role!=='coach'||x.actorOwner!==x.courseOwner?'DENIED':!x.title.trim()?'INVALID':x.requestKnown?'REPLAY':x.expectedRevision!==x.currentRevision?'STALE':'CREATED';
            if(c.expect!==expected||c.writes!==(expected==='CREATED'?1:0))throw Error('Deterministic evaluator rejected synthetic case '+JSON.stringify({id:c.id,input:x,actual:c.expect,writes:c.writes,expected,expectedWrites:expected==='CREATED'?1:0}));
            ids.add(c.id);outcomes.add(expected);
          }
          if(outcomes.size!==5||!artifact.cases.some(c=>c.expect==='DENIED'&&c.input.actorOwner!==c.input.courseOwner))throw Error('Missing required negative or ownership coverage');
          const result={schema:'native-route-tool-artifact/v1',model,provider:'groq',reasoningVariant:process.env.GROQ_REASONING_VARIANT,syntheticOnly:true,fixtureSha256:sha(JSON.stringify(fixture)),promptSha256:sha(prompt),receipt,actualToolCalls:1,artifactSha256:sha(JSON.stringify(artifact)),artifact,passed:true,roleAdmission:false,adapterQualification:false,observedAt:new Date().toISOString()};
          const dir=join(process.env.RUNNER_TEMP,'route-evidence');mkdirSync(dir,{recursive:true});writeFileSync(join(dir,'receipt.json'),JSON.stringify(result,null,2));
          console.log(JSON.stringify({model,actualToolCalls:1,caseCount:artifact.cases.length,passed:true,receipt,artifactSha256:result.artifactSha256,roleAdmission:false,adapterQualification:false},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: native-route-${{ matrix.label }}
          path: ${{ runner.temp }}/route-evidence/receipt.json
          retention-days: 14

  inspect-opencode:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.confirm == 'ROUTE QUALIFICATION' && github.repository == 'appsworld2027/parent-plus-ai-org' && github.ref == 'refs/heads/review/course-pilot-harness-20261127' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate exact free DeepSeek catalogue entry without credential or inference
        run: |
          node --input-type=module <<'NODE'
          const r=await fetch('https://opencode.ai/inference/v1/models',{redirect:'error',signal:AbortSignal.timeout(25000)});
          if(!r.ok)throw Error('OpenCode catalogue HTTP '+r.status);
          const j=await r.json(),m=j.data?.find(x=>x.id==='deepseek-v4.1-flash-free');
          if(!m)throw Error('Exact free DeepSeek alias unavailable');
          if(m.cost?.text?.input?.price!==0||m.cost?.text?.output?.price!==0)throw Error('Zero prices not verified; no request permitted');
          const cache=m.cost.text.input.cache;
          if(cache&&(cache.read!==undefined&&cache.read!==0||cache.write!==undefined&&cache.write!==0))throw Error('Non-zero or ambiguous cache cost');
          console.log(JSON.stringify({provider:'opencode',id:m.id,inputPrice:m.cost.text.input.price,outputPrice:m.cost.text.output.price,toolSupport:m.capabilities?.tools?.supported??null,metadataOnly:true,observedAt:new Date().toISOString()}));
          NODE
      - name: Inspect OpenCode CLI in disposable unauthenticated setup (no model run)
        env:
          OPENCODE_DISABLE_AUTOUPDATE: "1"
          OPENCODE_DISABLE_TELEMETRY: "1"
        run: |
          set -euo pipefail
          V=$(npm view opencode-ai version)
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "Exact disposable OpenCode version: $V"
          npm install --prefix "$RUNNER_TEMP/oc" --no-audit --no-fund "opencode-ai@$V" >/dev/null
          mkdir -p "$RUNNER_TEMP/oc-home" "$RUNNER_TEMP/oc-config"
          cd "$RUNNER_TEMP/oc-home"
          HOME="$RUNNER_TEMP/oc-home" XDG_CONFIG_HOME="$RUNNER_TEMP/oc-config" XDG_DATA_HOME="$RUNNER_TEMP/oc-home/data" timeout 45 "$RUNNER_TEMP/oc/node_modules/.bin/opencode" models > "$RUNNER_TEMP/model-list.txt"
          if grep -Fxq 'opencode/deepseek-v4.1-flash-free' "$RUNNER_TEMP/model-list.txt"; then echo 'Exact free alias visible through clean CLI. No inference performed.'; else echo 'BLOCKED: exact alias unavailable in signed-out CLI; no paid route attempted.'; exit 1; fi

  actual-deepseek-opencode:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.confirm == 'FOLLOWUP QUALIFICATION' && github.repository == 'appsworld2027/parent-plus-ai-org' && github.ref == 'refs/heads/review/course-pilot-harness-20261127' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      OPENCODE_DISABLE_AUTOUPDATE: "1"
      OPENCODE_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Reconfirm exact free price and install pinned OpenCode on ephemeral runner
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const r=await fetch('https://opencode.ai/inference/v1/models',{redirect:'error',signal:AbortSignal.timeout(25000)});
          if(!r.ok)throw Error('OpenCode catalogue HTTP '+r.status);
          const j=await r.json(),m=j.data?.find(x=>x.id==='deepseek-v4.1-flash-free'),c=m?.cost?.text;
          if(c?.input?.price!==0||c?.output?.price!==0||(c.input.cache&&[c.input.cache.read,c.input.cache.write].some(x=>x!==undefined&&x!==0))||m.capabilities?.tools?.supported!==true)throw Error('Exact free prices or tool capability no longer verified');
          console.log('Exact zero-priced DeepSeek route confirmed live; no paid credentials.');
          NODE
          npm install --prefix "$RUNNER_TEMP/oc" --no-audit --no-fund opencode-ai@1.19.6 >/dev/null
      - name: Run DeepSeek using read/write tools on synthetic-only local fixture
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/deepseek-sandbox"
          mkdir -p "$dir/home" "$dir/config" "$dir/data" "$dir/fixture" "$RUNNER_TEMP/deepseek-receipt"
          cd "$dir/fixture"
          cat > contract.json <<'JSON'
          {"id":"course-scope-v1","fields":{"actorOwner":["A","B"],"courseOwner":["A","B"],"role":["coach","parent"],"title":"string 0..20 characters","expectedRevision":[1,2,3],"currentRevision":[1,2,3],"requestKnown":"boolean"},"rules":["Check actorOwner equals courseOwner and role coach first; otherwise DENIED, writes 0.","Blank or whitespace title is INVALID, writes 0.","A known request is REPLAY, writes 0.","Expected revision not equal current revision is STALE, writes 0.","Else CREATED, writes 1."]}
          JSON
          cat > opencode.json <<'JSON'
          {"model":"opencode/deepseek-v4.1-flash-free","small_model":"opencode/deepseek-v4.1-flash-free","enabled_providers":["opencode"],"provider":{"opencode":{"whitelist":["deepseek-v4.1-flash-free"]}},"permission":{"*":"deny","read":"allow","glob":"allow","grep":"allow","write":"allow","edit":"allow","external_directory":"deny","bash":"deny","webfetch":"deny","websearch":"deny","task":"deny"},"autoupdate":false}
          JSON
          export HOME="$dir/home" XDG_CONFIG_HOME="$dir/config" XDG_DATA_HOME="$dir/data" OPENCODE_CONFIG="$dir/fixture/opencode.json"
          BIN="$RUNNER_TEMP/oc/node_modules/.bin/opencode"
          env | cut -d= -f1 | grep -Ei '^(GROQ|OPENAI|ANTHROPIC|OPENCODE_API_KEY|OPENROUTER|NVIDIA)' && { echo 'Unexpected model credential environment'; exit 1; } || true
          "$BIN" models | grep -Fx 'opencode/deepseek-v4.1-flash-free' >/dev/null
          DATE_START=$(date +%s)
          timeout 180 "$BIN" run --model opencode/deepseek-v4.1-flash-free --format json 'Read contract.json with the read tool first. You are an independent QA test author. Use write tool to write cases.json as JSON {"cases":[{"id":"normal","input":{"actorOwner":"A","courseOwner":"A","role":"coach","title":"Demo","expectedRevision":1,"currentRevision":1,"requestKnown":false},"expect":"CREATED","writes":1}]} with five cases exactly, one for each contract outcome. Use only the contract types. Cover cross-owner denial regardless of duplicate/stale, invalid title, stale, replay and valid create. Do not use shell, external tools, network, other files, or credentials. No extra JSON keys. End after writing the artifact.' > "$dir/events.jsonl" 2> "$dir/stderr.txt"
          export ROUTE_SECONDS=$(( $(date +%s)-DATE_START ))
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, lstatSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { join } from 'node:path';
          const root=process.env.RUNNER_TEMP,dir=join(root,'deepseek-sandbox'),work=join(dir,'fixture');
          const events=readFileSync(join(dir,'events.jsonl'),'utf8').split(/\r?\n/).filter(Boolean).map(x=>JSON.parse(x));
          const tools=events.filter(x=>x.type==='tool_use').map(x=>x.part||x);
          if(!tools.some(x=>x.tool==='read'&&JSON.stringify(x.state?.input??x.input??{}).includes('contract.json'))||!tools.some(x=>['write','edit'].includes(x.tool)&&JSON.stringify(x.state?.input??x.input??{}).includes('cases.json')))throw Error('Missing real read/write tool evidence');
          if(tools.some(x=>!['read','glob','grep','write','edit'].includes(x.tool)))throw Error('Unapproved tool invocation');
          const file=join(work,'cases.json');if(!lstatSync(file).isFile()||lstatSync(file).isSymbolicLink())throw Error('Invalid artifact path');
          const artifact=JSON.parse(readFileSync(file,'utf8'));
          if(!artifact||Object.keys(artifact).join()!=='cases'||!Array.isArray(artifact.cases)||artifact.cases.length!==5)throw Error('Wrong case artifact shape');
          const outcomes=new Set(),ids=new Set();
          for(const c of artifact.cases){
            if(!c||Object.keys(c).sort().join()!=='expect,id,input,writes'||!/^[A-Za-z0-9_-]{1,24}$/.test(c.id)||ids.has(c.id))throw Error('Malformed or duplicate case');
            const x=c.input;
            if(!x||Object.keys(x).sort().join()!=='actorOwner,courseOwner,currentRevision,expectedRevision,requestKnown,role,title'||!['A','B'].includes(x.actorOwner)||!['A','B'].includes(x.courseOwner)||!['coach','parent'].includes(x.role)||typeof x.title!=='string'||x.title.length>20||!/^[A-Za-z0-9 ]*$/.test(x.title)||![1,2,3].includes(x.expectedRevision)||![1,2,3].includes(x.currentRevision)||typeof x.requestKnown!=='boolean')throw Error('Invalid fictional test input');
            const expected=x.role!=='coach'||x.actorOwner!==x.courseOwner?'DENIED':!x.title.trim()?'INVALID':x.requestKnown?'REPLAY':x.expectedRevision!==x.currentRevision?'STALE':'CREATED';
            if(c.expect!==expected||c.writes!==(expected==='CREATED'?1:0))throw Error('Deterministic evaluator rejected synthetic case '+JSON.stringify({id:c.id,input:x,actual:c.expect,writes:c.writes,expected}));
            ids.add(c.id);outcomes.add(expected);
          }
          if(outcomes.size!==5||!artifact.cases.some(c=>c.expect==='DENIED'&&c.input.actorOwner!==c.input.courseOwner))throw Error('Missing required negative or ownership coverage');
          const finishes=events.filter(x=>x.type==='step_finish').map(x=>x.part||x);
          if(!finishes.length||finishes.some(x=>typeof x.cost==='number'&&x.cost!==0))throw Error('Missing execution receipt or non-zero reported cost');
          const sha=v=>createHash('sha256').update(v).digest('hex');
          const observedCost=finishes.every(x=>typeof x.cost==='number')?finishes.reduce((n,x)=>n+x.cost,0):null;
          const result={schema:'opencode-tool-artifact/v1',configuredRoute:'opencode/deepseek-v4.1-flash-free',clientVersion:'1.19.6',syntheticOnly:true,modelIdentity:'session export pending',fixtureSha256:sha(readFileSync(join(work,'contract.json'))),artifactSha256:sha(JSON.stringify(artifact)),artifact,toolCalls:tools.map(x=>x.tool),steps:finishes.map(x=>({cost:x.cost??null,tokens:x.tokens??null,reason:x.reason??null})),observedCost,seconds:Number(process.env.ROUTE_SECONDS),passed:true,roleAdmission:false,sessionID:events.find(x=>x.sessionID)?.sessionID??events.find(x=>x.part?.sessionID)?.part?.sessionID??null};
          writeFileSync(join(root,'deepseek-receipt','receipt.json'),JSON.stringify(result,null,2));
          if(!result.sessionID)throw Error('Missing session ID');
          writeFileSync(join(dir,'session-id'),result.sessionID);
          console.log(JSON.stringify({route:result.configuredRoute,tools:result.toolCalls,caseCount:5,observedCost,seconds:result.seconds,artifactSha256:result.artifactSha256,steps:result.steps},null,2));
          NODE
          session=$(cat "$dir/session-id")
          [[ "$session" =~ ^ses_[A-Za-z0-9]+$ ]]
          if "$BIN" export "$session" >"$dir/export.json" 2>/dev/null; then :; else "$BIN" session export "$session" >"$dir/export.json" 2>/dev/null; fi
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          const root=process.env.RUNNER_TEMP,p=join(root,'deepseek-receipt','receipt.json'),r=JSON.parse(readFileSync(p,'utf8')),e=JSON.parse(readFileSync(join(root,'deepseek-sandbox','export.json'),'utf8'));
          const ids=[];
          (function walk(o){if(!o||typeof o!=='object')return;if(o.role==='assistant'&&typeof o.modelID==='string'&&typeof o.providerID==='string')ids.push(o.providerID+'/'+o.modelID);for(const v of Object.values(o))walk(v)})(e);
          if(!ids.length||ids.some(i=>i!=='opencode/deepseek-v4.1-flash-free'))throw Error('Exact observed session model identity missing or different; route not admitted');
          r.modelIdentity=ids[0];r.actualModelReceipts=ids.length;
          writeFileSync(p,JSON.stringify(r,null,2));console.log('Observed exact OpenCode session model: '+ids[0]+'; receipts '+ids.length);
          NODE
