          const ref=load('ref-clean'),mutants=Array.from({length:6},(_,n)=>load('mutant-00'+(n+1))),v2=load('v2-clean'),guard=load('guard-clean'),guardMutant=load('guard-mutant');
          const refPass=ref?.exit===0&&ref.cases.length===6&&ref.cases.every(x=>x.status==='expected');
          const refMutants=refPass&&mutants.every(x=>x?.exit!==0&&x.cases.length===1&&x.cases[0].status==='unexpected'&&!!x.cases[0].error);
          const authorClean=v2?.exit===0&&v2.cases.length===6&&v2.cases.every(x=>x.status==='expected');
          const guardPass=guard?.exit===0&&guard.cases.length===1&&guard.cases[0].status==='expected'&&guardMutant?.exit!==0&&guardMutant.cases.length===1&&guardMutant.cases[0].status==='unexpected';
          const receipt={schema:'course-qa-control-execution/v1',scope:'synthetic controls, not actual product acceptance',refPass,referenceMutantsKilled:refMutants?6:mutants.filter(x=>x?.cases?.[0]?.status==='unexpected').length,authorClean,guardPass,authorCriticalMutationControlsPassed:false,reference:ref,mutants,author:v2,guard,guardMutant};
          writeFileSync(d+'/control-receipt.json',JSON.stringify(receipt,null,2));
          console.log(JSON.stringify(receipt,null,2));
          if(!refPass||!refMutants||!guardPass||!authorClean)process.exitCode=1;
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
