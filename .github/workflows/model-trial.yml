name: Model trial
on:
  workflow_dispatch:
    inputs:
      review_only:
        type: boolean
        description: Review the retained, previously tested candidate
        default: false
      review_provider:
        type: choice
        description: Provider for independent review
        options: [nvidia, groq]
        default: nvidia
permissions:
  contents: read
jobs:
  autonomy:
    if: ${{ !inputs.review_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install the existing AI Org NVIDIA adapter and agent client
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh >/dev/null
          "$HOME/.local/bin/uv" tool install free-claude-code
          npm install -g @anthropic-ai/claude-code
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Dev autonomously implements the fictional waitlist
        id: build
        continue-on-error: true
        env:
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
        run: |
          set -euo pipefail
          [ -n "$NVIDIA_NIM_API_KEY" ]
          mkdir -p "$HOME/.fcc" "$RUNNER_TEMP/pilot" "$RUNNER_TEMP/evidence"
          umask 077
          printf 'NVIDIA_NIM_API_KEY=%s\nMODEL=nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b\nFCC_OPEN_BROWSER=false\nREASONING_POLICY=low\n' "$NVIDIA_NIM_API_KEY" > "$HOME/.fcc/.env"
          fcc-server > "$RUNNER_TEMP/adapter.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/adapter.pid"
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8082/v1/models >/dev/null 2>&1 && break; sleep 1; done
          prompt="$(printf 'You are Dev, the AI Org coding specialist. This is an isolated exercise. Write the one deliverable with the Write tool immediately, then give the short handover. The external evaluator runs all tests.\n'; cat trial/autonomy/objective.md)"
          cd "$RUNNER_TEMP/pilot"
          printf '%s\n' "$prompt" | env -u NVIDIA_NIM_API_KEY ANTHROPIC_BASE_URL=http://127.0.0.1:8082 ANTHROPIC_AUTH_TOKEN=freecc DISABLE_AUTOUPDATER=1 \
            timeout 300 claude -p --permission-mode acceptEdits --allowedTools "Read,Write,Edit,Glob,Grep" --max-turns 16 --output-format stream-json --verbose > "$RUNNER_TEMP/build.jsonl"
      - name: Run the prewritten acceptance checks
        run: |
          set -euo pipefail
          git show "$GITHUB_SHA:trial/autonomy/acceptance.mjs" > "$RUNNER_TEMP/acceptance.mjs"
          node "$RUNNER_TEMP/acceptance.mjs" "$RUNNER_TEMP/pilot/waitlist.mjs" | tee "$RUNNER_TEMP/evidence/acceptance.txt"
          cp "$RUNNER_TEMP/pilot/waitlist.mjs" "$RUNNER_TEMP/evidence/waitlist.mjs"
      - name: Rex independently reviews the result
        env:
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
        run: |
          set -euo pipefail
          kill "$(cat "$RUNNER_TEMP/adapter.pid")" || true
          sleep 2
          umask 077
          printf 'NVIDIA_NIM_API_KEY=%s\nMODEL=nvidia_nim/mistralai/mistral-large-4-1t-a52b\nFCC_OPEN_BROWSER=false\nREASONING_POLICY=low\n' "$NVIDIA_NIM_API_KEY" > "$HOME/.fcc/.env"
          fcc-server > "$RUNNER_TEMP/review-adapter.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8082/v1/models >/dev/null 2>&1 && break; sleep 1; done
          prompt="$(cat org/agents/rex-reviewer.md trial/autonomy/objective.md; printf '\nReview the source below. Do not edit. Give PASS or CHANGES and specific observations about correctness, maintainability and remaining gaps.\n'; cat "$RUNNER_TEMP/evidence/waitlist.mjs")"
          cd "$RUNNER_TEMP/pilot"
          printf '%s\n' "$prompt" | env -u NVIDIA_NIM_API_KEY ANTHROPIC_BASE_URL=http://127.0.0.1:8082 ANTHROPIC_AUTH_TOKEN=freecc DISABLE_AUTOUPDATER=1 \
            timeout 240 claude -p --tools "" --max-turns 4 --output-format stream-json --verbose > "$RUNNER_TEMP/review.jsonl"
      - name: Report evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          if [ -s "$RUNNER_TEMP/build.jsonl" ]; then
            echo "Builder tool calls:"
            jq -r 'select(.type=="assistant") | .message.content[]? | select(.type=="tool_use") | .name' "$RUNNER_TEMP/build.jsonl" | sort | uniq -c || true
          fi
          for role in build review; do
            if [ -s "$RUNNER_TEMP/$role.jsonl" ]; then
              jq -c 'select(.type=="result") | {subtype,is_error,num_turns,duration_ms,modelUsage,result}' "$RUNNER_TEMP/$role.jsonl" | tee "$RUNNER_TEMP/evidence/$role.jsonl" || true
            fi
          done
          if [ -f "$RUNNER_TEMP/evidence/acceptance.txt" ]; then
            cat "$RUNNER_TEMP/evidence/acceptance.txt" >> "$GITHUB_STEP_SUMMARY"
            echo "Generated implementation:"
            cat "$RUNNER_TEMP/evidence/waitlist.mjs"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autonomy-pilot-evidence
          path: ${{ runner.temp }}/evidence/
  review_retained_candidate:
    if: inputs.review_only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify the retained candidate
        run: node trial/autonomy/acceptance.mjs trial/autonomy/waitlist.mjs
      - name: Get Rex's independent review from the selected provider
        env:
          REVIEW_PROVIDER: ${{ inputs.review_provider }}
          NVIDIA_NIM_API_KEY: ${{ inputs.review_provider == 'nvidia' && secrets.NVIDIA_NIM_API_KEY || '' }}
          GROQ_API_KEY: ${{ inputs.review_provider == 'groq' && secrets.GROQ_API_KEY || '' }}
        run: node trial/autonomy/review.mjs
