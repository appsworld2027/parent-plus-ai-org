          const prompt='You are an independent test author. Invoke Read exactly once with file path "fixture.json" before writing any cases. After receiving its result create five independently useful synthetic test cases covering each outcome once. Final output must be JSON object {"cases":[{"id":"normal","input":{"actorOwner":"A","courseOwner":"A","role":"coach","title":"Demo","expectedRevision":1,"currentRevision":1,"requestKnown":false},"expect":"CREATED","writes":1}]} with five case objects. Exercise mismatched ownership, stale conflicts, replay and invalid input, using only fixture field types. No extra fields or prose. Do not expose real data or execute writes.';
          const tools=[{type:'function',function:{name:'Read',description:'Read trusted synthetic course contract; read-only',parameters:{type:'object',properties:{path:{type:'string',enum:['fixture.json']}},required:['path'],additionalProperties:false}}}];
