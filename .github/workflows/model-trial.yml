          writeFileSync(dir+'/quinn-repaired.spec.ts',a.spec+'\n');writeFileSync(dir+'/quinn-repaired-guard.spec.ts',guard+'\n');writeFileSync(dir+'/receipt.json',JSON.stringify(receipt,null,2));writeFileSync(dir+'/author-artifact.json',JSON.stringify(a,null,2)); 
          console.log(JSON.stringify(receipt,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: course-quinn-fresh-author
          path: |
            ${{ runner.temp }}/course-author/quinn-repaired.spec.ts
            ${{ runner.temp }}/course-author/quinn-repaired-guard.spec.ts
