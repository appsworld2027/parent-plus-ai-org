              if(model==='openai/gpt-oss-120b')body.reasoning_effort='medium';
              const start=Date.now(),r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{Authorization:'Bearer '+key,'Content-Type':'application/json'},body:JSON.stringify(body),redirect:'error',signal:AbortSignal.timeout(110000)});
              if(!r.ok){const e=(await r.json().catch(()=>({}))).error;const code=/^[A-Za-z0-9_.-]{1,80}$/.test(e?.code??'')?e.code:null;results.push({role,status:'PROVIDER_FAILED',http:r.status,code});continue}
              const j=await r.json();if(j.model!==model)throw Error('Observed route mismatch');
              const artifact=j.choices?.[0]?.message?.content?.trim(),usage=j.usage??null;windowTokens+=usage?.total_tokens??estimated;windowStart=Date.now();
              if(typeof artifact!=='string'||artifact.length<400||artifact.length>16000)throw Error('Incomplete actual role artifact');
              writeFileSync(root+'/role-deliverables/'+role+'.md',artifact+'\n');
              const structure=j.choices?.[0]?.finish_reason==='stop'&&['DECISION','DELIVERABLE','EVIDENCE','RISKS','HANDOFF'].every(x=>artifact.includes(x));
              const receipt={role,source:ctx.source,model,reasoning:model==='openai/gpt-oss-120b'?'medium':'provider-default',contextSha256:sha(prompt+'\n'+raw),artifactSha256:sha(artifact+'\n'),durationMs:Date.now()-start,usage,structuralCheck:structure,finish:j.choices?.[0]?.finish_reason,roleAdmission:false,quality:'Pending independent scoring'};
              writeFileSync(root+'/role-deliverables/'+role+'.json',JSON.stringify(receipt,null,2));results.push({...receipt,status:structure?'ARTIFACT_PRODUCED':'STRUCTURE_FAILED'});
            }catch(e){results.push({role,status:'EXECUTION_FAILED',message:String(e.message).slice(0,120)});}
          }
