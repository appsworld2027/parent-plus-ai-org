          const raw=result.content.trim();writeFileSync(dir+'/raw-author.txt',raw+'\n');
          if(receipts.at(-1).finish!=='stop')throw Error('Incomplete fresh author response');
          const split=raw.split('\n//===GUARD===\n');if(split.length!==2)throw Error('Two exact files not separated');
          const strip=x=>x.trim().replace(/^\x60\x60\x60(?:typescript|tsx|ts)?\s*\n|\n\x60\x60\x60$/g,'').trim();
          const spec=strip(split[0]),guard=strip(split[1]);
          if(!guard.includes('GUARD-CRS-FLAG-OFF')||!guard.includes('window.__coachFixture.calls')||!spec.includes('window.__coachFixture.calls')||/window as any|__coachFixture\?\.|\.calls\s*\?\?/.test(spec+guard))throw Error('Unsafe or missing actual fixture guard');
          const ids=Array.from({length:6},(_,i)=>'CRS-01-SC-00'+(i+1));
          const proofs=[...spec.matchAll(/\/\/\s*PROOF:\s*([^\n\r]+)/gi)].map(m=>m[1]);
          const limits=spec.match(/\/\/\s*LIMITATIONS:\s*([^\n\r]+)/i);
          const a={spec,coverage:ids.map((id,i)=>({id,proof:proofs[i]})),limitations:limits?.[1]};
          if(typeof a.spec!=='string'||a.spec.length<1600||a.spec.length>15000||!Array.isArray(a.coverage)||a.coverage.length!==6||proofs.length!==6||typeof a.limitations!=='string')throw Error('Missing author artifact fields');
