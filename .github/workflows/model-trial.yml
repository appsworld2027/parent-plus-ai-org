          if(a.source!=='710082b2d8cf3c1007086df31f87b34ae8e02573'||sha(p)!==a.testHash||sha(g)!==a.guardHash||sha(readFileSync(d+'/support.json'))!==a.supportHash||sha(readFileSync('docs/product/coach-course-management/ACCEPTANCE.md'))!==a.contractHash)throw Error('Indexed receipt mismatch');
          for(const [path,h] of Object.entries(m.files))if(sha(readFileSync(path))!==h)throw Error('Support mismatch '+path);
