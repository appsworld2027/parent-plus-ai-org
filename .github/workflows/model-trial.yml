          const contract=readFileSync('docs/product/coach-course-management/ACCEPTANCE.md','utf8');
          if(a.source!=='710082b2d8cf3c1007086df31f87b34ae8e02573'||a.model!=='qwen/qwen3.8-27b'||a.stage!=='ai:tests'||a.testHash!=='11590e15173ec69a5982ae11b2a5217c4513c3c0cd7acf414293396a7dce46d6'||sha(spec)!==a.testHash||sha(readFileSync(d+'/support.json'))!==a.supportHash||sha(contract)!==a.contractHash)throw Error('Author does not match verified receipt');
          for(const [p,h] of Object.entries(m.files))if(sha(readFileSync(p))!==h)throw Error('Support mismatch '+p);
          const backend=readFileSync('e2e/support/backend.ts','utf8');
