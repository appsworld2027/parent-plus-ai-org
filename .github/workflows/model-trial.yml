          const paths=['e2e/support/backend.ts','playwright.config.ts','package.json','App.tsx'];
          const manifest={schema:'course-support/v1',source:'710082b2d8cf3c1007086df31f87b34ae8e02573',files:Object.fromEntries(paths.map(p=>[p,sha(readFileSync(p))]))};
          const contract=readFileSync('docs/product/coach-course-management/ACCEPTANCE.md','utf8');
