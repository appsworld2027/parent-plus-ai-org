# Temporary read-only evidence audit. Never merge.
name: Frontier Quinn exact repair diff audit (temporary)
on:
  pull_request:
    types: [opened,synchronize]
    branches: ['feat/frontier-trusted-receipts-20261127']
    paths: ['.github/workflows/model-trial.yml']
permissions:
  contents: read
  actions: read
jobs:
  compare:
    if: >-
      github.repository == 'appsworld2027/parent-plus-ai-org' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'review/frontier-quinn-artifact-20261127' &&
      github.event.pull_request.base.ref == 'feat/frontier-trusted-receipts-20261127' &&
      github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 554d92dd0b87afac7118377c00010434aaf6a139
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: frontier-quinn-candidate
          run-id: 46045161125
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/before
      - uses: actions/download-artifact@v4
        with:
          name: frontier-quinn-repair
          run-id: 46045718387
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/after
      - name: Verify exact artifact hashes and print bounded synthetic test diff
        env:
          BEFORE: ${{ runner.temp }}/before
          AFTER: ${{ runner.temp }}/after
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          import {execFileSync} from 'node:child_process';
          import {prepareFrontierCasebook,intakeFrontierArtifact} from './scripts/frontier-casebook.mjs';
          import {rubric} from './scripts/frontier-admission.mjs';
          const roleDefinitions=Object.fromEntries(rubric.roles.map(({role})=>[role,readFileSync('org/agents/'+role+'.md','utf8')]));
          const book=prepareFrontierCasebook({sourceSha:'1c10b67ef1eeecfc3a05263cef197fa84ba76697',seed:'synthetic-quinn-proof-20261127',roleDefinitions});
          const c=book.cases.find(x=>x.fixture.role==='quinn-qa'&&x.fixture.variant==='normal');
          const get=(dir,hash)=>{const a=intakeFrontierArtifact(c.fixture,JSON.parse(readFileSync(join(dir,'candidate.json'),'utf8')));if(a.artifactHash!==hash)throw Error('Artifact mismatch');return a;};
          const before=get(process.env.BEFORE,'573025d40cde7e300e0af9d3fc8c8809f7a62fd1023e863782138ded435cf121');
          const after=get(process.env.AFTER,'e9d478abbb37fdec59bf0648b559a1b6cf0029a56ed3a9c2a6d12fc080fa330c');
          const old=before.files.find(f=>f.path==='locked.test.mjs').content,next=after.files.find(f=>f.path==='locked.test.mjs').content;
          const p=join(process.env.BEFORE,'locked.test.mjs'),q=join(process.env.AFTER,'locked.test.mjs');writeFileSync(p,old);writeFileSync(q,next);
          let diff='';try {diff=execFileSync('diff',['-u',p,q],{encoding:'utf8',maxBuffer:30000});}catch(e){if(e.status!==1)throw e;diff=e.stdout;}
          console.log(JSON.stringify({before:before.artifactHash,after:after.artifactHash,diff:diff.slice(0,16000),truncated:diff.length>16000}));
          NODE
