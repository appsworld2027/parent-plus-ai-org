# Temporary read-only diagnostic; never merge.
name: Frontier Sam exact failure audit (temporary)
on:
  pull_request:
    types: [opened,synchronize]
    branches: ['feat/frontier-review-evaluator-20261127']
    paths: ['.github/workflows/model-trial.yml']
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    if: >-
      github.repository == 'appsworld2027/parent-plus-ai-org' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'review/frontier-sam-artifact-20261127' &&
      github.event.pull_request.base.ref == 'feat/frontier-review-evaluator-20261127' &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [normal, edge, adversarial]
    env:
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontier-sam-independent-behavior-${{ matrix.variant }}
          run-id: 46047195862
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/evidence
      - name: Inspect bounded independent failing-test evidence
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/evidence
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const x=JSON.parse(readFileSync(process.env.EVIDENCE_DIR+'/behavior.json','utf8'));
          const hashes={normal:'3d1caefa2eff0def25ba497cc4b107b5aeb04e04d1e1a1ce683a2166be488c70',edge:'7831e857e207d0dc570de51f3c762848b38add0d96ce88a8457e077d4b43ba5c',adversarial:'e90d2569d09e50841697a4bd43318b67f98beb3fa83af44d8f4c73685d0c162c'};
          if(x.runId!=='46047195862'||x.sourceSha!=='3ed337eacf1ad54b507e9616c3ce674a8db8ca52'||x.artifactHash!==hashes[process.env.VARIANT]||x.result.behavior.counts.fail!==1)throw Error('Unexpected exact evidence');
          const raw=x.result.behavior.diagnostic?.stdout??'',idx=raw.indexOf('not ok');
          if(idx<0)throw Error('No test failure evidence');
          console.log(JSON.stringify({variant:process.env.VARIANT,artifactHash:x.artifactHash,status:x.result.status,failure:raw.slice(idx,idx+2200)}));
          NODE
