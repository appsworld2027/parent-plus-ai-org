        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const root=process.env.RUNNER_TEMP,model=process.env.ROLE_MODEL,key=process.env.GROQ_API_KEY,sha=x=>createHash('sha256').update(x).digest('hex');
          if(!key||!['openai/gpt-oss-120b','qwen/qwen3.8-27b'].includes(model))throw Error('Exact approved route unavailable');
          const roles=process.env.ROLE_LIST.split(','),results=[];let windowStart=Date.now(),windowTokens=0;
          for(const role of roles){
