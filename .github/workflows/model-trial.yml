          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const dir=process.env.RUNNER_TEMP+'/course-author',sha=x=>createHash('sha256').update(x).digest('hex'),input=JSON.parse(readFileSync(dir+'/input.json','utf8'));
          const model='openai/gpt-oss-120b',key=process.env.GROQ_API_KEY;if(!key)throw Error('Missing approved free key');
          const prompt='You are Quinn, canonical QA author seat ai:tests. First call read_course_contract exactly once to obtain real sanitized Parent Plus Course contract and fixture API. Independently author TWO executable Playwright TypeScript files: first exactly six test() calls, titles each starting CRS-01-SC-001 through CRS-01-SC-006; second exactly one flag-off GUARD-CRS-FLAG-OFF test. Separate the two complete raw TypeScript files with a line containing only //===GUARD===. Each imports fixture helpers. Use concise test bodies. The fixture Window interface is already declared; read window.__coachFixture.calls directly, no any cast, optional chain or default. For current navigation use the exact contract tabs Today, Schedule, Feedback, Students, Fees; Courses is a button not a tab. Keep text selectors exact where needed; prove stage order after edit, two immutable distinct history versions/titles, and both real request listener and fixture call checks as the contract requires. Do not use existing reference spec; construct your own. Use only the supplied fixture API and exact accessible names in the contract; each test must fail for the intended missing Courses button at baseline with expect(...).toBeVisible, not syntax or setup. No skips, mocks other than supplied backend fixture, timeout manipulation outside test.setTimeout(60000), network calls, shell, imports outside @playwright/test and ../support/backend, file writes, or product changes. Include substantive independent assertions all six requirements. Output exactly the two raw TypeScript files separated as specified (no JSON envelope or markdown). Add a comment beginning PROOF: within each of six tests explaining the planned assertion, and a LIMITATIONS: comment at the end with unverified gaps. No execution claims.';
          const tool={type:'function',function:{name:'read_course_contract',description:'Read exact public product contract, canonical role, and fictional fixture API',parameters:{type:'object',properties:{document:{type:'string',enum:['coach-course-management']}},required:['document'],additionalProperties:false}}};
          const receipts=[];
