          const receipt={schema:'course-quinn-red/v1',intendedRed:pass,count:results.length,results:results.map(x=>({title:x.title,status:x.status,missingHook:x.errors.some(m=>m.includes('Courses')&&m.includes('toBeVisible'))})),redReceiptSha256:createHash('sha256').update(b).digest('hex')};
