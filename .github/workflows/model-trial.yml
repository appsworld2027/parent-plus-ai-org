# Temporary deterministic P0 run only; never merge this branch into main.
name: Course pilot P0 baseline (no inference)
on:
  workflow_dispatch:
    inputs:
      confirm:
        type: string
        required: true
        description: Enter COURSE BASELINE ONLY or GROQ METADATA ONLY
permissions:
  contents: read
concurrency:
  group: course-p0-baseline-only
  cancel-in-progress: false
env:
  TRIAL_PROFILE: course-pilot
jobs:
  baseline:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.confirm == 'COURSE BASELINE ONLY' &&
      github.repository == 'appsworld2027/parent-plus-ai-org' &&
      github.ref == 'refs/heads/review/course-pilot-harness-20261127' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 9ca107c3fe23688e8defe88fd3d46836f6e28bbd
          path: handbook
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Prepare pinned public source and locked exact draft harness
        run: bash handbook/scripts/safe-trial/prepare.sh handbook
      - name: Install dependencies before isolation
        run: |
          set -euo pipefail
          cd /srv/trial/product
          npm ci --no-audit --no-fund
          PLAYWRIGHT_BROWSERS_PATH=/srv/trial/browsers npx playwright install --with-deps chromium
          chmod -R a+rX /srv/trial/browsers
          bash /srv/trial/judge/scripts/safe-trial/isolate.sh
      - name: Prove intended RED and existing regression GREEN
        run: |
          set -euo pipefail
          . /srv/trial/judge/scripts/safe-trial/lib.sh
          lock_workspace grading
          bash /srv/trial/judge/scripts/safe-trial/run-tests.sh /srv/trial/out
          [ "$(cat /srv/trial/out/check.exit)" = 0 ] || { echo "::error::Baseline TypeScript/unit checks failed"; exit 1; }
          node /srv/trial/judge/scripts/course-pilot/baseline.mjs /srv/trial/out/acceptance.json /srv/trial/out/all.json
          echo "Exact harness 9ca107c3fe23688e8defe88fd3d46836f6e28bbd; exact public product 710082b2d8cf3c1007086df31f87b34ae8e02573; no inference or product writes." >> "$GITHUB_STEP_SUMMARY"
      - name: Scan non-model baseline evidence
        if: always()
        id: scan
        run: |
          if [ ! -f /srv/trial/judge/scripts/course-pilot/scan.sh ] || [ ! -d /srv/trial/out ]; then echo 'No baseline evidence to scan'; exit 1; fi
          bash /srv/trial/judge/scripts/course-pilot/scan.sh /srv/trial/out
      - uses: actions/upload-artifact@v4
        if: always() && steps.scan.outcome == 'success'
        with:
          name: course-p0-baseline-no-inference
          path: /srv/trial/out/
          retention-days: 14

  metadata:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.confirm == 'GROQ METADATA ONLY' &&
      github.repository == 'appsworld2027/parent-plus-ai-org' &&
      github.ref == 'refs/heads/review/course-pilot-harness-20261127' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Read provider model catalogue with the existing credential (no inference)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const key=process.env.GROQ_API_KEY;
          if(!key)throw Error('Existing credential missing');
          const t=Date.now();
          const r=await fetch('https://api.groq.com/openai/v1/models',{headers:{Authorization:'Bearer '+key},redirect:'error',signal:AbortSignal.timeout(30000)});
          if(!r.ok)throw Error('Provider catalogue rejected existing key: HTTP '+r.status);
          const x=await r.json();
          const routes=['openai/gpt-oss-120b','qwen/qwen3.8-27b'];
          for(const id of routes)if(!x.data?.some(m=>m.id===id&&m.active!==false))throw Error('Approved route unavailable: '+id);
          console.log(JSON.stringify({type:'metadata-only',provider:'groq',http:r.status,availableRoutes:routes,observedAt:new Date().toISOString(),durationMs:Date.now()-t,inferenceRequests:0},null,2));
          NODE
