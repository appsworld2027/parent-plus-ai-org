name: GitLab Mirror

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "**"
  delete:
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: read

concurrency:
  group: gitlab-mirror
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror repository to GitLab
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Synchronize branches and tags to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_REPOSITORY: ${{ vars.GITLAB_REPOSITORY }}
        run: |
          set -euo pipefail
          if [[ -z "$GITLAB_TOKEN" || -z "$GITLAB_REPOSITORY" ]]; then
            echo "Configure repository secrets.GITLAB_TOKEN and variable GITLAB_REPOSITORY (group/project)." >&2
            exit 1
          fi
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@gitlab.com/${GITLAB_REPOSITORY}.git"
          git fetch --no-tags --prune origin \
            '+refs/heads/*:refs/mirror/heads/*' \
            '+refs/tags/*:refs/mirror/tags/*'
          # Keep GitLab's last copy of main if GitHub removes it.
          gitlab_refs=$(git ls-remote --refs gitlab 'refs/heads/*' 'refs/tags/*')
          deletions=()
          while IFS=$'\t' read -r _ ref; do
            [[ -z "$ref" || "$ref" == refs/heads/main ]] && continue
            if ! git show-ref --verify --quiet "refs/mirror/${ref#refs/}"; then
              deletions+=(":${ref}")
            fi
          done <<< "$gitlab_refs"
          git push --atomic gitlab \
            '+refs/mirror/heads/*:refs/heads/*' \
            '+refs/mirror/tags/*:refs/tags/*' \
            "${deletions[@]}"
