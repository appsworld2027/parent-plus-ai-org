name: Founder dashboard

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
  issues:
    types: [opened, closed, reopened, labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

concurrency:
  group: founder-dashboard
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build dashboard
        env:
          GH_TOKEN: ${{ github.token }}
          AI_ORG_REPO: ${{ github.repository }}
          ENGINE_FREE: ${{ secrets.GROQ_API_KEY != '' }}
        run: node scripts/build-dashboard.mjs
      - name: Upload founder dashboard
        uses: actions/upload-artifact@v4
        with:
          name: founder-dashboard-${{ github.run_number }}
          path: site
          retention-days: 14
