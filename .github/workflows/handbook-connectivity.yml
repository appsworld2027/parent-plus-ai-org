name: AI Org handbook connectivity
on:
  workflow_call:
    inputs:
      handbook_ref:
        type: string
        required: true
    secrets:
      AI_ORG_HANDBOOK_SSH_KEY:
        required: false
  workflow_dispatch:
    inputs:
      handbook_ref:
        description: AI Org commit SHA to verify
        type: string
        required: true

permissions:
  contents: read

jobs:
  connectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Load AI Org handbook using the caller token
        id: public_handbook
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          repository: appsworld2027/parent-plus-ai-org
          ref: ${{ inputs.handbook_ref }}
          path: .ai-org-handbook
          token: ${{ github.token }}
          persist-credentials: false

      - name: Check private handbook access
        if: steps.public_handbook.outcome == 'failure' && github.repository != 'appsworld2027/parent-plus-ai-org'
        env:
          HANDBOOK_ACCESS: ${{ secrets.AI_ORG_HANDBOOK_SSH_KEY != '' }}
        run: |
          if [ "$HANDBOOK_ACCESS" != true ]; then
            echo "::error::AI Org handbook is not readable with the caller token; private access requires AI_ORG_HANDBOOK_SSH_KEY (read-only deploy key)."
            exit 1
          fi

      - name: Clear incomplete public handbook checkout
        if: steps.public_handbook.outcome == 'failure' && github.repository != 'appsworld2027/parent-plus-ai-org'
        run: |
          rm -rf .ai-org-handbook

      - name: Load AI Org handbook using the read-only deploy key
        if: steps.public_handbook.outcome == 'failure' && github.repository != 'appsworld2027/parent-plus-ai-org'
        uses: actions/checkout@v5
        with:
          repository: appsworld2027/parent-plus-ai-org
          ref: ${{ inputs.handbook_ref }}
          path: .ai-org-handbook
          ssh-key: ${{ secrets.AI_ORG_HANDBOOK_SSH_KEY }}
          persist-credentials: false
      - name: Verify exact handbook and role router availability
        working-directory: .ai-org-handbook
        env:
          EXPECTED: ${{ inputs.handbook_ref }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test -s AGENTS.md
          test -s scripts/agent-router.mjs
          test -s scripts/loop.mjs
          test -s governance/AUTONOMY_POLICY.json
          node --check scripts/agent-router.mjs
          node --check scripts/loop.mjs
          echo "Verified handbook $EXPECTED (no model calls or product writes)" | tee -a "$GITHUB_STEP_SUMMARY"
