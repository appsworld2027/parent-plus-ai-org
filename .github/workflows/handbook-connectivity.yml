name: AI Org handbook connectivity
on:
  workflow_call:
    inputs:
      handbook_ref:
        type: string
        required: true
    secrets:
      AI_ORG_HANDBOOK_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      handbook_ref:
        description: AI Org commit SHA to verify
        type: string
        required: true

permissions:
  contents: read

jobs:
  connectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check handbook access
        if: github.repository != 'appsworld2027/parent-plus-ai-org'
        env:
          HANDBOOK_ACCESS: ${{ secrets.AI_ORG_HANDBOOK_TOKEN != '' }}
        run: |
          if [ "$HANDBOOK_ACCESS" != true ]; then
            echo "::error::AI_ORG_HANDBOOK_TOKEN is missing from the caller."
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          repository: appsworld2027/parent-plus-ai-org
          ref: ${{ inputs.handbook_ref }}
          token: ${{ github.repository == 'appsworld2027/parent-plus-ai-org' && github.token || secrets.AI_ORG_HANDBOOK_TOKEN }}
          persist-credentials: false
      - name: Verify exact handbook and role router availability
        env:
          EXPECTED: ${{ inputs.handbook_ref }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test -s AGENTS.md
          test -s scripts/agent-router.mjs
          test -s scripts/loop.mjs
          test -s governance/AUTONOMY_POLICY.json
          node --check scripts/agent-router.mjs
          node --check scripts/loop.mjs
          echo "Verified handbook $EXPECTED (no model calls or product writes)" | tee -a "$GITHUB_STEP_SUMMARY"
