name: Daily organization report
on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Generate report
        run: |
          python3 org.py daily-report demo/status.json --ledger demo/usage.jsonl +            | tee -a "$GITHUB_STEP_SUMMARY"
