name: Free-model agent smoke test
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing AI Org issue with an ai:* stage label
        required: true
        type: string
      handbook_ref:
        description: AI Org handbook commit, branch or tag
        required: false
        default: main
        type: string
permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read
  statuses: read
jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' && vars.UNATTENDED_AGENTS == 'on' && github.event.repository.private == true
    uses: ./.github/workflows/agent-worker.yml
    with:
      number: ${{ github.event_name == 'workflow_dispatch' && inputs.issue_number || '91' }}
      handbook_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.handbook_ref || github.event.pull_request.head.sha }}
      dispatch_workflow: ai-agents.yml
      tool_mode: readonly
    secrets:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
