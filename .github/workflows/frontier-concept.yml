name: Frontier product and architecture regression
on:
  pull_request:
    paths:
      - 'scripts/frontier-concept-evaluator.mjs'
      - 'scripts/frontier-admission.mjs'
      - 'scripts/frontier-casebook.mjs'
      - 'governance/FRONTIER_ARTIFACT_RUBRIC.json'
      - 'governance/FRONTIER_CONCEPT_BEHAVIOR.md'
      - 'tests/frontier-concept-evaluator.test.mjs'
      - 'tests/frontier-admission.test.mjs'
      - 'tests/frontier-casebook.test.mjs'
      - '.github/workflows/frontier-concept.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/frontier-concept-evaluator.mjs'
      - 'scripts/frontier-admission.mjs'
      - 'scripts/frontier-casebook.mjs'
      - 'governance/FRONTIER_ARTIFACT_RUBRIC.json'
      - 'governance/FRONTIER_CONCEPT_BEHAVIOR.md'
      - 'tests/frontier-concept-evaluator.test.mjs'
      - 'tests/frontier-admission.test.mjs'
      - 'tests/frontier-casebook.test.mjs'
      - '.github/workflows/frontier-concept.yml'
permissions:
  contents: read
jobs:
  concept-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test tests/frontier-concept-evaluator.test.mjs tests/frontier-admission.test.mjs tests/frontier-casebook.test.mjs
