name: Codex subscription smoke trial

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type CODEX SUBSCRIPTION TRIAL (synthetic code only; no push)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: codex-subscription-trial
  cancel-in-progress: false

jobs:
  trial:
    if: >-
      inputs.confirm == 'CODEX SUBSCRIPTION TRIAL' &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Prepare isolated synthetic workspace
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$RUNNER_TEMP/codex-trial-workspace"
          CODEX_HOME="$RUNNER_TEMP/codex-trial-home"
          mkdir -p "$WORKSPACE" "$CODEX_HOME"
          cp -R trial/codex-subscription/. "$WORKSPACE/"
          chmod 700 "$CODEX_HOME"
          printf 'workspace=%s\n' "$WORKSPACE" >> "$GITHUB_OUTPUT"
          printf 'codex_home=%s\n' "$CODEX_HOME" >> "$GITHUB_OUTPUT"
          sha256sum "$WORKSPACE/test/greeting.test.mjs" | cut -d' ' -f1 > "$RUNNER_TEMP/locked-tests.sha256"
          echo "Prepared synthetic workspace; no product repository files will be edited."

      - name: Verify the acceptance tests are red before implementation
        shell: bash
        env:
          WORKSPACE: ${{ steps.prepare.outputs.workspace }}
        run: |
          set +e
          cd "$WORKSPACE"
          node --test test/greeting.test.mjs > "$RUNNER_TEMP/baseline-tests.txt" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/baseline-tests.txt"
          if [ "$rc" -eq 0 ]; then
            echo "::error::The locked baseline unexpectedly passed; the trial fixture is invalid."
            exit 1
          fi
          grep -q '# fail 3' "$RUNNER_TEMP/baseline-tests.txt" || {
            echo "::error::Expected exactly three failing acceptance tests."
            exit 1
          }

      - name: Install Codex CLI and provision subscription login
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          CODEX_HOME: ${{ steps.prepare.outputs.codex_home }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CODEX_AUTH_JSON" ]; then
            echo "::error::Add the CODEX_AUTH_JSON repository secret from the signed-in Codex CLI auth.json. Do not paste it into logs or chat."
            exit 1
          fi
          npm install --global @openai/codex
          printf '%s' "$CODEX_AUTH_JSON" > "$CODEX_HOME/auth.json"
          chmod 600 "$CODEX_HOME/auth.json"
          unset CODEX_AUTH_JSON
          codex --version

      - name: Implement the synthetic task with Codex
        env:
          CODEX_HOME: ${{ steps.prepare.outputs.codex_home }}
          WORKSPACE: ${{ steps.prepare.outputs.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          PROMPT="$(cat task.md)
          
          Work only in this isolated synthetic workspace. Change only src/greeting.mjs. Do not edit tests or task.md. Do not use the network, GitHub, git push, or any external service. Run node --test test/greeting.test.mjs before finishing. If the tests pass, summarize the exact file changed and test result."
          timeout 15m codex exec --sandbox workspace-write "$PROMPT" | tee "$RUNNER_TEMP/codex-output.txt"

      - name: Verify implementation and locked tests
        env:
          WORKSPACE: ${{ steps.prepare.outputs.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(sha256sum "$WORKSPACE/test/greeting.test.mjs" | cut -d' ' -f1)"
          EXPECTED="$(cat "$RUNNER_TEMP/locked-tests.sha256")"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Codex modified the locked acceptance tests."
            exit 1
          fi
          if [ "$(find "$WORKSPACE" -type f | wc -l)" -ne 3 ]; then
            echo "::error::Codex created or removed files outside the allowed implementation slot."
            find "$WORKSPACE" -type f -print
            exit 1
          fi
          cd "$WORKSPACE"
          node --test test/greeting.test.mjs | tee "$RUNNER_TEMP/final-tests.txt"
          diff -u "$GITHUB_WORKSPACE/trial/codex-subscription/src/greeting.mjs" "$WORKSPACE/src/greeting.mjs" > "$RUNNER_TEMP/source.patch" || true
          test -s "$RUNNER_TEMP/source.patch"
          echo "PASS: Codex changed only src/greeting.mjs and all locked tests passed."

      - name: Upload non-secret trial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-subscription-trial-evidence
          path: |
            ${{ runner.temp }}/codex-output.txt
            ${{ runner.temp }}/baseline-tests.txt
            ${{ runner.temp }}/final-tests.txt
            ${{ runner.temp }}/source.patch
          if-no-files-found: ignore
          retention-days: 3
