name: Frontier planning regression
on:
  pull_request:
    paths:
      - 'scripts/frontier-planning-evaluator.mjs'
      - 'scripts/frontier-admission.mjs'
      - 'tests/frontier-planning-evaluator.test.mjs'
      - 'governance/FRONTIER_PLANNING_BEHAVIOR.md'
      - '.github/workflows/frontier-planning.yml'
permissions:
  contents: read
jobs:
  planning-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test tests/frontier-planning-evaluator.test.mjs
