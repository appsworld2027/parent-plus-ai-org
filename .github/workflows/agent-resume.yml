# Standard recovery uses only the approved Groq free route.
# NVIDIA is evaluation-only and cannot wake ordinary delivery. No paid fallback.
name: Agent resume

on:
  workflow_call:
    inputs:
      dispatch_workflow:
        required: false
        type: string
        default: ai-agents.yml
    secrets:
      GROQ_API_KEY:
        required: false
      NVIDIA_NIM_API_KEY:
        required: false

jobs:
  resume:
    # Explicitly enabled per repository; AI Org may run in its own public repo, external callers must be private.
    if: vars.UNATTENDED_AGENTS == 'on' && (github.repository == 'appsworld2027/parent-plus-ai-org' || github.event.repository.private == true)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ai-resume-${{ github.repository }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      HAS_GROQ: ${{ secrets.GROQ_API_KEY != '' }}
      WORKFLOW: ${{ inputs.dispatch_workflow }}
    steps:
      - name: Re-dispatch resumable items from trusted runtime receipts
        run: |
          set -euo pipefail
          node --input-type=module <<'RECOVERY_JS'
          import { execFileSync } from "node:child_process";
          // BEGIN RECOVERY POLICY
          export const STAGES = new Set(["ai:discovery", "ai:plan", "ai:lane-a", "ai:lane-b", "ai:design", "ai:tests", "ai:tests-review", "ai:tests-signoff", "ai:build", "ai:database", "ai:integration", "ai:qa", "ai:review", "ai:release-ops", "ai:fix"]);
          export const MAX_RECOVERIES = 3;
          // A resumed turn can consume substantial free-provider quota. One
          // bounded recovery claim per sweep; normal independent lanes are unaffected.
          export const MAX_DISPATCHES_PER_SWEEP = 1;
          const ACTIVE_RUN_STATES = new Set(['requested','waiting','pending','queued','in_progress']);
          export function recoveryCapacity({hasGroq,runs,currentRunId}={}) {
            if (hasGroq !== true) return {allow:false,reason:'approved standard Groq route unavailable'};
            if (!Array.isArray(runs) || !/^[1-9]\d*$/.test(String(currentRunId))) return {allow:false,reason:'active-run evidence unavailable'};
            for (const r of runs) {
              if (!Number.isSafeInteger(r?.id) || r.id < 1 || !(ACTIVE_RUN_STATES.has(r.status) || r.status === 'completed'))
                return {allow:false,reason:'malformed active-run evidence'};
              if (String(r.id) !== String(currentRunId) && ACTIVE_RUN_STATES.has(r.status))
                return {allow:false,reason:'another agent workflow run is active'};
            }
            return {allow:true,reason:'no other active agent workflow run observed'};
          }
          export function stageOf(issue) {
            if (issue?.state !== "open" || !Array.isArray(issue.labels)) return null;
            const labels = issue.labels.map(l => typeof l === "string" ? l : l?.name);
            if (labels.includes("ai:blocked")) return null;
            const stages = [...new Set(labels.filter(l => STAGES.has(l)))];
            return stages.length === 1 ? stages[0] : null;
          }
          export function parseReceipt(comment) {
            if (comment?.user?.login !== "github-actions[bot]" || comment.user.type !== "Bot" ||
                !Number.isSafeInteger(comment.id) || !Number.isFinite(Date.parse(comment.created_at))) return null;
            const marker = String(comment.body ?? "").split("\n", 1)[0];
            const m = marker.match(/^<!-- ai-org:runtime:v1 state=(started|executing|paused|blocked|failed|completed|claimed|dispatch_failed) stage=(ai:[a-z-]+) run=([1-9]\d*) attempt=([1-9]\d*) mode=(standard|readonly)(?: source=([1-9]\d*))? -->$/);
            if (!m || !STAGES.has(m[2])) return null;
            if (["claimed","dispatch_failed"].includes(m[1]) !== Boolean(m[6])) return null;
            return {id:comment.id, at:Date.parse(comment.created_at), state:m[1], stage:m[2], run:m[3], attempt:Number(m[4]), mode:m[5], source:m[6]};
          }
          export function planResume(issue, comments, run, now = Date.now()) {
            const stage = stageOf(issue);
            if (!stage) return {action:"skip",reason:"not an unblocked single active stage"};
            const receipts = (comments ?? []).map(parseReceipt).filter(Boolean).sort((a,b)=>a.at-b.at || a.id-b.id);
            const latest = receipts.at(-1);
            if (!latest || latest.stage !== stage) return {action:"skip",reason:"no current-stage runtime receipt"};
            if (latest.mode !== "standard") return {action:"skip",reason:"read-only work cannot use standard dispatch"};
            if (["claimed","dispatch_failed"].includes(latest.state)) return {action:"hold",reason:"existing dispatch claim; no repeat"};
            if (latest.state === "executing") return {action:"hold",reason:"possible partial writes require reconciliation"};
            if (!["paused","started"].includes(latest.state)) return {action:"skip",reason:"not a resumable runtime state"};
            let claims = 0;
            for (let i=receipts.length-1; i>=0; i--) {
              const r=receipts[i];
              if (r.stage !== stage || r.state === "completed") break;
              if (r.state === "claimed") claims++;
            }
            if (claims >= MAX_RECOVERIES) return {action:"hold",reason:"bounded recovery budget exhausted"};
            if (!run) return {action:"need-run",source:latest};
            if (String(run.id) !== latest.run || run.run_attempt !== latest.attempt) return {action:"hold",reason:"run/attempt receipt mismatch"};
            if (run.status !== "completed") return {action:"skip",reason:"worker run not terminal"};
            if (latest.state === "paused" && run.conclusion !== "failure") return {action:"hold",reason:"pause has no matching transient failure"};
            if (latest.state === "started" && !["cancelled","timed_out"].includes(run.conclusion)) return {action:"hold",reason:"interruption before execution not verified"};
            const ended = Date.parse(run.updated_at);
            if (!Number.isFinite(ended)) return {action:"hold",reason:"missing run completion time"};
            const delay = 15 * 60 * 1000 * 2 ** claims;
            if (now < Math.max(latest.at,ended) + delay) return {action:"skip",reason:"recovery cooldown"};
            return {action:"dispatch",source:latest,claims,stage};
          }
          // END RECOVERY POLICY

          if (process.env.HAS_GROQ !== "true") {
            console.log("No approved standard Groq route connected - nothing to resume. NVIDIA trial credentials cannot wake standard delivery.");
            process.exit(0);
          }
          const repo = process.env.GITHUB_REPOSITORY;
          const workflow = process.env.WORKFLOW;
          if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repo ?? "") ||
              !/^[A-Za-z0-9_.-]+\.ya?ml$/.test(workflow ?? "")) throw new Error("Invalid resume configuration");
          const gh = (...args) => execFileSync("gh",args,{encoding:"utf8",timeout:30000,maxBuffer:8*1024*1024,stdio:["ignore","pipe","pipe"]}).trim();
          const api = path => JSON.parse(gh("api","repos/"+repo+"/"+path));
          const rows = (path,query) => gh("api","--paginate","repos/"+repo+"/"+path,"--jq",query).split("\n").filter(Boolean).map(JSON.parse);
          const commentsFor = n => rows("issues/"+n+"/comments?per_page=100",'.[] | select(.user.login=="github-actions[bot]" and (.body|startswith("<!-- ai-org:runtime:v1 "))) | {id,created_at,user,body:(.body|split("\n")[0])}');
          const issues = rows("issues?state=open&sort=updated&direction=asc&per_page=100",'.[] | {number,state,labels}').filter(stageOf);
          const activeRuns = () => [...ACTIVE_RUN_STATES].flatMap(status =>
            rows("actions/workflows/"+encodeURIComponent(workflow)+"/runs?status="+status+"&per_page=100",'.workflow_runs[] | {id,status}'));
          let dispatched=0, attempted=0, scanned=0, holds=0;
          for (const issue of issues) {
            if (attempted>=MAX_DISPATCHES_PER_SWEEP || scanned>=100) break;
            scanned++;
            const n=issue.number;
            if (!Number.isSafeInteger(n) || n<1) continue;
            try {
              const initial=planResume(issue,commentsFor(n),null);
              if (initial.action!=="need-run") {
                if (initial.action==="hold") { holds++; console.log("Held #"+n+": "+initial.reason); }
                continue;
              }
              const run=api("actions/runs/"+initial.source.run);
              const current=api("issues/"+n);
              const decision=planResume(current,commentsFor(n),run);
              if (decision.action!=="dispatch" || decision.source.id!==initial.source.id) {
                if (decision.action==="hold") { holds++; console.log("Held #"+n+": "+decision.reason); }
                continue;
              }
              const receipt = state => "<!-- ai-org:runtime:v1 state="+state+" stage="+decision.stage+" run="+process.env.GITHUB_RUN_ID+" attempt="+process.env.GITHUB_RUN_ATTEMPT+" mode=standard source="+decision.source.id+" -->";
              // Repo-scoped recovery gate; this is not a cross-repository global quota lock.
              // Reconcile active worker status immediately before claiming an eligible item.
              let capacity;
              try { capacity=recoveryCapacity({hasGroq:true,runs:activeRuns(),currentRunId:process.env.GITHUB_RUN_ID}); }
              catch { capacity={allow:false,reason:'active-run evidence unavailable'}; }
              if (!capacity.allow) { holds++; console.log('Held recovery sweep: '+capacity.reason); break; }
              // Count the claim attempt even if the network outcome is uncertain.
              // The Issues API handles both issue and pull-request comments.
              attempted++;
              gh("api","--method","POST","repos/"+repo+"/issues/"+n+"/comments","--raw-field","body="+receipt("claimed"));
              try {
                gh("workflow","run",workflow,"--repo",repo,"-f","number="+n);
                dispatched++;
                console.log("Resumed #"+n+" from receipt "+decision.source.id);
              } catch {
                gh("api","--method","POST","repos/"+repo+"/issues/"+n+"/comments","--raw-field","body="+receipt("dispatch_failed"));
                holds++;
                console.log("Held #"+n+": dispatch outcome uncertain; no automatic repeat");
              }
            } catch {
              holds++;
              console.log("Held #"+n+": runtime evidence unavailable; no dispatch");
            }
          }
          const summary="Scanned "+scanned+"/"+issues.length+" active items; recovery claims attempted "+attempted+"; dispatched "+dispatched+"; holds "+holds+".";
          console.log(summary);
          if (process.env.GITHUB_STEP_SUMMARY) {
            const { appendFileSync } = await import("node:fs");
            appendFileSync(process.env.GITHUB_STEP_SUMMARY,summary+"\n");
          }
          RECOVERY_JS
