# Reusable "resume paused work" sweep. When the Groq free-tier key exists, resume open agent-stage
# issues/PRs whose latest comment is the AI Org pause notice. No paid fallback is available.
name: Agent resume

on:
  workflow_call:
    inputs:
      dispatch_workflow:
        required: false
        type: string
        default: ai-agents.yml
    secrets:
      GROQ_API_KEY:
        required: false

jobs:
  resume:
    # Default enabled; set UNATTENDED_AGENTS=off in the caller repo for the emergency stop.
    if: vars.UNATTENDED_AGENTS != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      HAS_ENGINE: ${{ secrets.GROQ_API_KEY != '' }}
      WORKFLOW: ${{ inputs.dispatch_workflow }}
    steps:
      - name: Re-dispatch paused items
        run: |
          set -euo pipefail
          if [ "$HAS_ENGINE" != "true" ]; then echo "No engine connected - nothing to resume." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          count=0
          for n in $(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" --jq '.[] | select([.labels[].name] | index("ai:blocked") | not) | select([.labels[].name] | any(. == "ai:discovery" or . == "ai:plan" or . == "ai:tests" or . == "ai:tests-review" or . == "ai:tests-signoff" or . == "ai:build" or . == "ai:qa" or . == "ai:review" or . == "ai:fix")) | .number'); do
            last=$(gh api "repos/$GITHUB_REPOSITORY/issues/$n/comments?per_page=100" --jq 'last | .body // ""')
            if printf '%s' "$last" | grep -q 'ai-org:paused'; then
              gh workflow run "$WORKFLOW" --repo "$GITHUB_REPOSITORY" -f number="$n"
              echo "Resumed #$n" | tee -a "$GITHUB_STEP_SUMMARY"; count=$((count+1))
            fi
          done
          echo "Resumed $count paused item(s)." | tee -a "$GITHUB_STEP_SUMMARY"
