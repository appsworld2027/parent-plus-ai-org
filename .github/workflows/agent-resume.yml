# Reusable resume sweep. Resume open agent-stage issues/PRs when an approved Groq or NVIDIA free key exists.
# Reviewer stages still require Groq; no paid fallback is available.
name: Agent resume

on:
  workflow_call:
    inputs:
      dispatch_workflow:
        required: false
        type: string
        default: ai-agents.yml
    secrets:
      GROQ_API_KEY:
        required: false
      NVIDIA_NIM_API_KEY:
        required: false

jobs:
  resume:
    # Explicitly enabled per repository; AI Org may run in its own public repo, external callers must be private.
    if: vars.UNATTENDED_AGENTS == 'on' && (github.repository == 'appsworld2027/parent-plus-ai-org' || github.event.repository.private == true)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      HAS_ENGINE: ${{ secrets.GROQ_API_KEY != '' || secrets.NVIDIA_NIM_API_KEY != '' }}
      WORKFLOW: ${{ inputs.dispatch_workflow }}
    steps:
      - name: Re-dispatch paused items
        run: |
          set -euo pipefail
          if [ "$HAS_ENGINE" != "true" ]; then echo "No approved free provider connected - nothing to resume." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          count=0
          for n in $(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" --jq '.[] | select([.labels[].name] | index("ai:blocked") | not) | select([.labels[].name] | any(. == "ai:discovery" or . == "ai:plan" or . == "ai:lane-a" or . == "ai:lane-b" or . == "ai:design" or . == "ai:tests" or . == "ai:tests-review" or . == "ai:tests-signoff" or . == "ai:build" or . == "ai:database" or . == "ai:integration" or . == "ai:qa" or . == "ai:review" or . == "ai:release-ops" or . == "ai:fix")) | .number'); do
            last=$(gh api "repos/$GITHUB_REPOSITORY/issues/$n/comments?per_page=100" --jq 'last | .body // ""')
            if printf '%s' "$last" | grep -q 'ai-org:paused'; then
              gh workflow run "$WORKFLOW" --repo "$GITHUB_REPOSITORY" -f number="$n"
              echo "Resumed #$n" | tee -a "$GITHUB_STEP_SUMMARY"; count=$((count+1))
            fi
          done
          echo "Resumed $count paused item(s)." | tee -a "$GITHUB_STEP_SUMMARY"
