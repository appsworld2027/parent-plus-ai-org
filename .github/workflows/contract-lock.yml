name: contract-lock
# Reusable check for product repos — AGENTS.md §7A rule 4 ("locked goalposts").
# Call it from a product repo workflow that runs on pull_request
# (types: opened, synchronize, reopened, labeled, unlabeled):
#   jobs:
#     contract-lock:
#       uses: appsworld2027/parent-plus-ai-org/.github/workflows/contract-lock.yml@main
#       with:
#         locked-paths: tests/acceptance/
on:
  workflow_call:
    inputs:
      locked-paths:
        description: Comma-separated folders that hold locked acceptance tests
        type: string
        default: tests/acceptance/
    secrets:
      AI_ORG_HANDBOOK_SSH_KEY:
        required: false

jobs:
  contract-lock:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the product PR (full history for the diff)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Detect AI Org handbook visibility
        id: handbook_visibility
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o "$RUNNER_TEMP/ai-org-repo.json" -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/appsworld2027/parent-plus-ai-org)
          if [ "$status" = "200" ]; then
            private=$(jq -er '.private | tostring' "$RUNNER_TEMP/ai-org-repo.json")
          elif [ "$status" = "404" ]; then
            # A caller token cannot see a private repository. Treat it as private and require the read-only key.
            private=true
          else
            echo "::error::Could not verify AI Org handbook visibility (HTTP $status); refusing an unknown checkout mode."
            exit 1
          fi
          case "$private" in true|false) ;; *) echo "::error::Invalid repository visibility response"; exit 1;; esac
          echo "private=$private" >> "$GITHUB_OUTPUT"

      - name: Check private handbook access
        if: steps.handbook_visibility.outputs.private == 'true' && github.repository != 'appsworld2027/parent-plus-ai-org'
        env:
          HANDBOOK_ACCESS: ${{ secrets.AI_ORG_HANDBOOK_SSH_KEY != '' }}
        run: |
          if [ "$HANDBOOK_ACCESS" != true ]; then
            echo "::error::AI Org handbook is private or hidden from the caller token; configure AI_ORG_HANDBOOK_SSH_KEY (read-only deploy key)."
            exit 1
          fi

      - name: Load AI Org handbook
        uses: actions/checkout@v5
        with:
          repository: appsworld2027/parent-plus-ai-org
          ref: main
          path: .ai-org-tools
          token: ${{ github.token }}
          ssh-key: ${{ github.repository != 'appsworld2027/parent-plus-ai-org' && steps.handbook_visibility.outputs.private == 'true' && secrets.AI_ORG_HANDBOOK_SSH_KEY || '' }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check locked acceptance tests
        env:
          BASE_REF: origin/${{ github.base_ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          CONTRACT_LOCK_PATHS: ${{ inputs.locked-paths }}
        run: node .ai-org-tools/scripts/contract-lock.mjs
