name: contract-lock
# Reusable check for product repos — AGENTS.md §7A rule 4 ("locked goalposts").
# Call it from a product repo workflow that runs on pull_request
# (types: opened, synchronize, reopened, labeled, unlabeled):
#   jobs:
#     contract-lock:
#       uses: appsworld2027/parent-plus-ai-org/.github/workflows/contract-lock.yml@main
#       with:
#         locked-paths: tests/acceptance/
on:
  workflow_call:
    inputs:
      locked-paths:
        description: Comma-separated folders that hold locked acceptance tests
        type: string
        default: tests/acceptance/
    secrets:
      AI_ORG_HANDBOOK_SSH_KEY:
        required: false

jobs:
  contract-lock:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the product PR (full history for the diff)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Load AI Org handbook using the caller token
        id: public_handbook
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          repository: appsworld2027/parent-plus-ai-org
          ref: main
          path: .ai-org-tools
          token: ${{ github.token }}
          persist-credentials: false

      - name: Check private handbook access
        if: steps.public_handbook.outcome == 'failure' && github.repository != 'appsworld2027/parent-plus-ai-org'
        env:
          HANDBOOK_ACCESS: ${{ secrets.AI_ORG_HANDBOOK_SSH_KEY != '' }}
        run: |
          if [ "$HANDBOOK_ACCESS" != true ]; then
            echo "::error::AI Org handbook is not readable with the caller token; private access requires AI_ORG_HANDBOOK_SSH_KEY (read-only deploy key)."
            exit 1
          fi

      - name: Clear incomplete public handbook checkout
        if: steps.public_handbook.outcome == 'failure' && github.repository != 'appsworld2027/parent-plus-ai-org'
        run: |
          rm -rf .ai-org-tools

      - name: Load AI Org handbook using the read-only deploy key
        if: steps.public_handbook.outcome == 'failure' && github.repository != 'appsworld2027/parent-plus-ai-org'
        uses: actions/checkout@v5
        with:
          repository: appsworld2027/parent-plus-ai-org
          ref: main
          path: .ai-org-tools
          ssh-key: ${{ secrets.AI_ORG_HANDBOOK_SSH_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check locked acceptance tests
        env:
          BASE_REF: origin/${{ github.base_ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          CONTRACT_LOCK_PATHS: ${{ inputs.locked-paths }}
        run: node .ai-org-tools/scripts/contract-lock.mjs
