name: Route inventory issue
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  route:
    if: contains(github.event.issue.body, '<!-- autonomous-inventory -->')
    runs-on: ubuntu-latest
    steps:
      - name: Route issue to specialist workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = context.payload.issue.body || '';
            const role = /supabase|sql|schema|migration|database/i.test(body) ? 'Database' :
              /api|integration|webhook|service|auth/i.test(body) ? 'Integration' :
              /test|qa|validation|security/i.test(body) ? 'QA' :
              /prd|product|roadmap|requirement|founder/i.test(body) ? 'Product Manager' : 'Coding';
            const checklist = `## Autonomous role routing\n\n**Assigned role:** ${role}\n\n### Required execution\n- Read the exact evidence artifact and affected files.\n- Write or update the product and technical acceptance criteria.\n- Implement in an isolated branch only.\n- Run happy, negative, edge, security, performance, regression, and recovery tests.\n- Update the founder-readable CSV/XLSX test matrix.\n- Open a PR with exact evidence links.\n\nProtected actions (production, destructive changes, paid services, credentials, legal/privacy decisions) remain gated.`;
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: checklist});
