name: Parent Plus inventory scan
on:
  schedule:
    - cron: '47 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AI organization
        uses: actions/checkout@v4
      - name: Checkout Parent Plus read-only
        uses: actions/checkout@v4
        with:
          repository: appsworld2027/Parent-plus-
          path: target-parent-plus
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Generate inventory
        run: node scripts/feature-inventory.mjs target-parent-plus
      - name: Create deduplicated inventory issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPOSITORY: appsworld2027/Parent-plus-
          INVENTORY_PATH: evidence/feature-inventory.json
        run: node scripts/open-inventory-issue.mjs
      - name: Publish inventory artifact
        uses: actions/upload-artifact@v4
        with:
          name: parent-plus-feature-inventory
          path: evidence/feature-inventory.json
