name: Approved product planning and PM routing

on:
  workflow_dispatch:
    inputs:
      idea_id:
        description: 'IDEA-ID with an approved founder decision'
        required: true
        type: string

permissions:
  contents: write

jobs:
  planning:
    name: CPTO to PM delivery plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Generate PRD, feature map and PM workstreams
        run: node scripts/create-product-plan.mjs "${{ inputs.idea_id }}"
      - name: Publish planning summary
        run: |
          echo '## Approved product plan' >> "$GITHUB_STEP_SUMMARY"
          cat product/plans/${{ inputs.idea_id }}.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit plan and routing record
        run: |
          git config user.name 'appsworld-ai-org'
          git config user.email 'ai-org@appsworld.local'
          git add product/plans orchestration/task-events.jsonl
          git commit -m "product: create approved plan for ${{ inputs.idea_id }}"
          git push
