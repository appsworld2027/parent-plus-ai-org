# Wakes the named AI agents when an ai:* stage label is added to an issue or PR,
# or when a previous agent dispatches the next stage.
name: AI agents

on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      number:
        description: Issue or PR number
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  id-token: write

jobs:
  agent:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.label.name, 'ai:')
    uses: ./.github/workflows/agent-worker.yml
    with:
      number: ${{ github.event.issue.number || github.event.pull_request.number || inputs.number }}
    secrets: inherit
