# Wakes the named AI agents when an ai:* stage label is added to an issue or PR,
# when a previous agent dispatches the next stage, or (hourly) to resume paused work.
name: AI agents

on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      number:
        description: Issue or PR number
        required: true
  schedule:
    - cron: "17 * * * *"

permissions: {}

jobs:
  agent:
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    if: vars.UNATTENDED_AGENTS == 'on' && (github.event_name == 'workflow_dispatch' || ((github.event_name == 'issues' || github.event_name == 'pull_request') && startsWith(github.event.label.name, 'ai:')))
    uses: ./.github/workflows/agent-worker.yml
    with:
      number: ${{ github.event.issue.number || github.event.pull_request.number || inputs.number }}
    # Current canonical policy is free-only. Do not delegate paid-engine credentials.
    secrets:
      NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}

  resume:
    permissions:
      issues: read
      pull-requests: read
      actions: write
    if: vars.UNATTENDED_AGENTS == 'on' && github.event_name == 'schedule'
    uses: ./.github/workflows/agent-resume.yml
    secrets:
      NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
