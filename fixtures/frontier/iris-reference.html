<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reminder board</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#1c2a3b;font:16px/1.5 system-ui,sans-serif}main{max-width:660px;margin:auto;padding:16px}h1{line-height:1.2;font-size:1.7rem}section{background:white;border:1px solid #c9d5e1;padding:16px;border-radius:12px;margin:14px 0}label{display:block;font-weight:650}input{width:100%;min-width:0;padding:12px;font:inherit;border:1px solid #64748b;border-radius:8px;margin-block:6px}button{min-height:44px;padding:10px 14px;border:0;border-radius:8px;background:#155e75;color:white;font:inherit;font-weight:600;cursor:pointer}button:disabled{background:#cad1d9;color:#485462;cursor:not-allowed}button:focus-visible,input:focus-visible{outline:3px solid #ea7900;outline-offset:2px}ul{list-style:none;padding:0;margin:0}li{border-bottom:1px solid #d9e1eb;padding:12px 0;display:flex;align-items:flex-start;flex-wrap:wrap;gap:8px}li span{flex:1 1 180px;min-width:0;overflow-wrap:anywhere}#status{padding:6px 0}#alert{color:#a12222;font-weight:600;overflow-wrap:anywhere}small{color:#42536a}button[hidden],p[hidden]{display:none}
</style></head><body><main><h1>Reminder board</h1><p>Keep household reminders clear and up to date.</p>
<div id="status" role="status" aria-live="polite">Loading reminders</div><div id="alert" role="alert"></div>
<button id="retry" type="button" hidden>Retry loading</button><button id="refresh" type="button" hidden>Refresh reminders</button>
<section aria-label="Create or edit reminder"><form id="form" novalidate><label for="title">Reminder title</label><input id="title" aria-describedby="limit" autocomplete="off"><small id="limit">Use 1–80 characters.</small><p><button id="save" type="submit" disabled>Save reminder</button></p></form></section>
<section aria-label="Saved reminders"><p id="empty" hidden>No reminders</p><ul id="list" aria-label="Reminders"></ul></section>
</main><script>
const el=id=>document.getElementById(id),status=el('status'),error=el('alert'),input=el('title'),save=el('save'),retry=el('retry'),refresh=el('refresh'),list=el('list'),empty=el('empty');
let rows=[],editing=null,ready=false,pending=false;
function update(){save.disabled=!ready||pending}
function render(){list.replaceChildren();empty.hidden=rows.length!==0;for(const r of rows){const li=document.createElement('li'),text=document.createElement('span'),b=document.createElement('button');text.textContent=r.title;b.textContent='Edit';b.setAttribute('aria-label','Edit reminder '+r.title);b.type='button';b.disabled=!ready;b.onclick=()=>{editing={id:r.id,version:r.version};input.value=r.title;error.textContent='';refresh.hidden=true;input.focus()};li.append(text,b);list.append(li)}}
async function load(keepDraft=false){ready=false;update();status.textContent='Loading reminders';error.textContent='';retry.hidden=true;refresh.hidden=true;const result=await window.boardList();rows=result.records||[];if(result.state==='ok'||result.state==='offline'){ready=result.state==='ok';status.textContent=ready?'Ready':'Offline — cached reminders only';if(keepDraft&&editing){const latest=rows.find(r=>r.id===editing.id);if(latest)editing.version=latest.version;else editing=null}render()}else{rows=[];render();status.textContent='Unavailable';error.textContent='Could not load reminders';retry.hidden=false}update()}
retry.onclick=()=>load();refresh.onclick=()=>load(true);
el('form').addEventListener('submit',async e=>{e.preventDefault();if(!ready||pending)return;error.textContent='';const t=input.value.trim();if(!t||t.length>80){error.textContent='Enter a title of 1 to 80 characters';input.focus();return}pending=true;update();status.textContent='Saving reminder';const result=await window.boardSave({id:editing?.id??null,title:t,expectedVersion:editing?.version??0});pending=false;update();if(result.state==='ok'){const r=result.record;rows=rows.filter(x=>x.id!==r.id).concat(r);editing=null;input.value='';render();status.textContent='Saved reminder';error.textContent=''}else if(result.state==='stale'){status.textContent='Not saved';error.textContent='This reminder changed elsewhere. Refresh before retrying.';refresh.hidden=false;}else if(result.state==='denied'){status.textContent='Not saved';error.textContent='Permission denied. Your draft is kept.'}else{status.textContent='Not saved';error.textContent='Unable to save. Your draft is kept.'}});
load();
</script></body></html>
