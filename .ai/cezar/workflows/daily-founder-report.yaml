name: daily-founder-report
description: Generate a truthful founder report from repository status and usage evidence.
steps:
  - id: report
    name: Founder report
    runner: codex
    skill: verification-before-completion
    prompt: "Generate today's founder report from demo/status.json, the Cezar task dashboard, decision register, quality results and usage records. Distinguish completed, active, blocked and unmeasured usage. Never invent token counts or cost. {{task}}"
  - id: reporting-check
    name: Reporting quality gate
    command: "python3 org.py daily-report demo/status.json --ledger demo/usage.jsonl"
